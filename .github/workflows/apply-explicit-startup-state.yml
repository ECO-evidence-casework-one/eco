name: Apply explicit development startup state

on:
  push:
    branches: [ integration/explicit-development-startup-state-20260905 ]
    paths:
      - scripts/ops/apply_explicit_startup_state.py
      - scripts/ops/fix_explicit_startup_import.py
      - .github/workflows/apply-explicit-startup-state.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: false
      - name: Apply and qualify startup-state slice
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ops/apply_explicit_startup_state.py
          python3 scripts/ops/fix_explicit_startup_import.py
          gofmt -w internal/eco/development_workspace.go internal/eco/development_workspace_test.go cmd/eco/main_other.go cmd/eco/main_windows.go cmd/eco/winapi_windows.go cmd/eco/ui_regression_test.go
          python3 scripts/check_source_policy.py
          go test ./...
          go vet ./...
          GOOS=windows GOARCH=amd64 go test -c ./internal/eco -o "$RUNNER_TEMP/eco-internal.test.exe"
          GOOS=windows GOARCH=amd64 go test -c ./cmd/eco -o "$RUNNER_TEMP/eco-ui.test.exe"
          GOOS=windows GOARCH=amd64 go build ./cmd/eco
          git diff --check
      - name: Commit qualified product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "eco-ci-bot"
          git config user.email "eco-ci-bot@users.noreply.github.com"
          git add internal/eco/development_workspace.go internal/eco/development_workspace_test.go cmd/eco/main_other.go cmd/eco/main_windows.go cmd/eco/winapi_windows.go cmd/eco/ui_regression_test.go
          git commit -m "Add explicit clean development startup state"
          git push origin HEAD:integration/explicit-development-startup-state-20260905
