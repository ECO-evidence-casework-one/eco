name: Qualify workspace format compatibility

on:
  push:
    branches: [integration/workspace-format-compatibility-20260905]
    paths: [.github/workflows/qualify-workspace-format.yml]

permissions:
  contents: write

jobs:
  qualify:
    if: github.ref == 'refs/heads/integration/workspace-format-compatibility-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 8
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: false
      - name: Prove regressions against unchanged application baseline
        shell: bash
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/eco-format-baseline"
          git worktree add --detach "$baseline" d9541cd1f2830f175ff0d80bb812276a2ea5864a
          cp internal/eco/workspace_format_test.go "$baseline/internal/eco/"
          set +e
          (cd "$baseline" && go test -count=1 -json -run '^TestWorkspaceFormat' ./internal/eco) > "$RUNNER_TEMP/format-baseline.jsonl" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/format-baseline.jsonl"
          test "$result" -eq 1
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          rows = []
          for line in Path(os.environ['RUNNER_TEMP'], 'format-baseline.jsonl').read_text().splitlines():
              try: rows.append(json.loads(line))
              except json.JSONDecodeError: pass
          failed = {r.get('Test') for r in rows if r.get('Action') == 'fail' and r.get('Test')}
          passed = {r.get('Test') for r in rows if r.get('Action') == 'pass' and r.get('Test')}
          required = {'TestWorkspaceFormatRejectsWithoutMutation/unknown_top', 'TestWorkspaceFormatRejectsWithoutMutation/unknown_nested', 'TestWorkspaceFormatRestoreRejectsWithoutActivation/unknown_top'}
          assert required <= failed, f'Missing reproduced regressions: {required - failed}'
          assert 'TestWorkspaceFormatLegacyDefaultsPreserved' in passed
          assert 'TestWorkspaceFormatCompatibleBackupFixture' in passed
          summary = {'failed_tests': sorted(failed), 'passed_tests': sorted(passed)}
          Path(os.environ['RUNNER_TEMP'], 'format-baseline-summary.json').write_text(json.dumps(summary, indent=2))
          print('EXPECTED BASELINE REGRESSIONS REPRODUCED; compatible control fixtures pass')
          PY
      - name: Apply exact bounded integration patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          def replace_once(text, old, new):
              assert text.count(old) == 1, 'Source anchor did not match exactly once'
              return text.replace(old, new, 1)
          p = Path('internal/eco/vault.go')
          s = p.read_text()
          s = replace_once(s,
              'func OpenVault(root string) (*Vault, error) {\n\tif root == "" {\n\t\treturn nil, errors.New("empty vault root")\n\t}\n',
              'func OpenVault(root string) (*Vault, error) {\n\tif err := preflightWorkspaceFormat(root); err != nil {\n\t\treturn nil, err\n\t}\n')
          s = replace_once(s,
              '\tif err := os.MkdirAll(v.Objects, 0700); err != nil {',
              '\tif err := preflightWorkspaceFormat(root); err != nil {\n\t\treturn nil, err\n\t}\n\tif err := os.MkdirAll(v.Objects, 0700); err != nil {')
          s = replace_once(s,
              '\tvar ws Workspace\n\tif err := json.Unmarshal(plain, &ws); err != nil {\n\t\treturn fmt.Errorf("workspace format invalid: %w", err)\n\t}\n\tif ws.Schema != Schema {\n\t\treturn fmt.Errorf("unsupported workspace schema %d", ws.Schema)\n\t}\n',
              '\tws, err := decodeWorkspaceMetadata(plain)\n\tif err != nil {\n\t\treturn err\n\t}\n')
          s = replace_once(s,
              '\tvar current Workspace\n\tif err := json.Unmarshal(plain, &current); err != nil {\n\t\treturn fmt.Errorf("%w: current workspace format is invalid: %v", ErrWorkspaceStale, err)\n\t}\n',
              '\tcurrent, err := decodeWorkspaceMetadata(plain)\n\tif err != nil {\n\t\treturn fmt.Errorf("%w: current workspace format is invalid: %v", ErrWorkspaceStale, err)\n\t}\n')
          p.write_text(s)
          p = Path('internal/eco/backup.go')
          s = replace_once(p.read_text(),
              '\t\t\tif err = json.Unmarshal(data, &ws); err != nil {\n\t\t\t\treturn RestoreReceipt{}, errors.New("workspace schema is invalid")\n\t\t\t}\n',
              '\t\t\tws, err = decodeWorkspaceMetadata(data)\n\t\t\tif err != nil {\n\t\t\t\treturn RestoreReceipt{}, fmt.Errorf("backup workspace format is not supported: %w", err)\n\t\t\t}\n')
          p.write_text(s)
          PY
          gofmt -w internal/eco/vault.go internal/eco/backup.go internal/eco/workspace_format.go internal/eco/workspace_format_test.go
          git diff --check
      - name: Qualify candidate and keep binaries ephemeral
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_source_policy.py
          go test -count=1 -json -run '^TestWorkspaceFormat' ./internal/eco | tee "$RUNNER_TEMP/format-candidate.jsonl"
          go test -count=1 ./...
          go vet ./...
          GOOS=windows GOARCH=amd64 go test -c ./internal/eco -o "$RUNNER_TEMP/eco-format-windows.test.exe"
          GOOS=windows GOARCH=amd64 go build -o "$RUNNER_TEMP/eco-format-windows.exe" ./cmd/eco
          git diff --check
      - name: Record qualification and commit only reviewed source paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          summary = json.loads(Path(os.environ['RUNNER_TEMP'], 'format-baseline-summary.json').read_text())
          rows = [json.loads(s) for s in Path(os.environ['RUNNER_TEMP'], 'format-candidate.jsonl').read_text().splitlines()]
          passed = sorted(r['Test'] for r in rows if r.get('Action') == 'pass' and r.get('Test'))
          assert not any(r.get('Action') == 'fail' for r in rows)
          failed_leaf = [s for s in summary['failed_tests'] if '/' in s]
          leaves = [s for s in passed if '/' in s or s in {'TestWorkspaceFormatLegacyDefaultsPreserved', 'TestWorkspaceFormatCompatibleBackupFixture'}]
          text = '# Workspace format compatibility qualification\n\n'
          text += 'Refs #4. Synthetic development qualification only; no release or real-evidence approval.\n\n'
          text += 'Application baseline: `d9541cd1f2830f175ff0d80bb812276a2ea5864a`.\n\n'
          text += f'Qualification run: `{os.environ["GITHUB_RUN_ID"]}`.\n\n'
          text += f'Unchanged baseline: {len(failed_leaf)} failing regression subcases; supported legacy and compatible backup control fixtures both passed.\n\n'
          text += f'Patched candidate: {len(leaves)} leaf acceptance cases passed. Full Go test suite, go vet, source policy and Windows cross-build also passed. Native Windows execution and the normal full PR pipeline remain separate gates.\n\n'
          text += '## Scope\n\nStrict unknown-field/schema/trailing-data refusal is shared by workspace loading, authenticated metadata checks and portable-restore manifest decoding. A read-only preflight runs before ownership side effects and again under ownership before creation/recovery. Supported schema-1 metadata without revision/owner-transaction fields retains its records and gains those fields only on an explicit successful save.\n\n'
          text += '## Boundaries\n\nNo schema migration is introduced. Unknown same-schema extensions are deliberately refused, not deleted. This does not retrofit safety into historical executables, prove all candidate downgrade combinations, or close interruption/crash/rollback, real Windows UX, accessibility or release gates. Standard-library JSON duplicate-key and case-insensitive-name semantics are unchanged in this bounded slice. Extra startup validation cost still needs low-spec measurement. Issue #4 remains open.\n\n'
          text += '## Passed acceptance cases\n\n' + ''.join('- `' + name + '`\n' for name in leaves)
          Path('docs/control/WORKSPACE_FORMAT_COMPATIBILITY_20260905.md').write_text(text)
          PY
          git diff --check
          branch='integration/workspace-format-compatibility-20260905'
          git fetch origin "$branch"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/eco/vault.go internal/eco/backup.go internal/eco/workspace_format.go internal/eco/workspace_format_test.go docs/control/WORKSPACE_FORMAT_COMPATIBILITY_20260905.md
          git commit -m 'Reject incompatible workspaces and restore manifests without silent metadata loss'
          git push origin "HEAD:refs/heads/$branch"
