name: Resolve controlled PDF renderer staging collisions

on:
  push:
    branches:
      - staging/github-foss-stack-plus-pdf-renderer-20260904
    paths:
      - .github/workflows/resolve-pdf-renderer-collisions.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: staging/github-foss-stack-plus-pdf-renderer-20260904
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23.12'
          cache: false
      - name: Resolve exact known conflicts
        shell: bash
        run: python3 scripts/resolve_pdf_renderer_collisions.py
      - name: Qualify and persist combined source
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          gofmt -w internal/eco cmd/eco
          go test ./...
          go vet ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/eco-combined-pdf-preview.exe ./cmd/eco
          python3 scripts/check_source_policy.py
          git diff --check
          git config user.name 'ECO GitHub integration bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit --no-edit
          git push origin HEAD:staging/github-foss-stack-plus-pdf-renderer-20260904
