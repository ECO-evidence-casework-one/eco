name: Apply native PDF reader integration

on:
  push:
    branches:
      - integration/native-pdf-reader-20260904
    paths:
      - .github/workflows/apply-native-pdf-reader.yml
      - scripts/apply_native_pdf_reader.sh
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: integration/native-pdf-reader-20260904
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23.12'
          cache: false
      - name: Apply and qualify native PDF integration
        shell: bash
        run: bash scripts/apply_native_pdf_reader.sh
