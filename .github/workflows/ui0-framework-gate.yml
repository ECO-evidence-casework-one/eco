name: UI-0 framework gate

on:
  pull_request:
    paths:
      - 'prototypes/ui0/**'
      - '.github/workflows/ui0-framework-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eco-ui0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qt-windows:
    name: Qt 6 / QML Windows build
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
      - name: Configure and build Qt UI-0
        shell: msys2 {0}
        run: |
          cmake -S prototypes/ui0/qt -B build/ui0-qt -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ui0-qt --config Release
      - name: Deploy complete Qt UI-0 runtime closure
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p dist/ui0-qt/qml
          cp build/ui0-qt/ECO_UI0_QT.exe dist/ui0-qt/
          windeployqt --release --no-translations dist/ui0-qt/ECO_UI0_QT.exe

          # Main.qml is compiled into the executable, while Qt Quick Controls and style
          # modules are dynamic in this proof. Preserve the required QML module trees.
          cp -R /ucrt64/share/qt6/qml/QtQuick dist/ui0-qt/qml/
          cp -R /ucrt64/share/qt6/qml/QtQml dist/ui0-qt/qml/

          # windeployqt handles Qt libraries but not the complete MinGW/MSYS2 transitive
          # dependency graph. Compute the recursive dependency closure for every EXE/DLL
          # already staged and copy any matching UCRT64 runtime DLL into the app root.
          # This catches dependencies such as libpng, md4c, freetype and harfbuzz rather
          # than assuming that a successful link means a clean Windows machine can launch.
          for pass in 1 2 3 4 5 6 7 8; do
            added=0
            while IFS= read -r bin; do
              while IFS= read -r dep; do
                [ -n "$dep" ] || continue
                if find dist/ui0-qt -type f -iname "$dep" -print -quit | grep -q .; then
                  continue
                fi
                src=$(find /ucrt64/bin -maxdepth 1 -type f -iname "$dep" -print -quit || true)
                if [ -n "$src" ]; then
                  echo "Deploying transitive runtime: $dep"
                  cp "$src" dist/ui0-qt/
                  added=1
                fi
              done < <(objdump -p "$bin" 2>/dev/null | sed -n 's/^[[:space:]]*DLL Name:[[:space:]]*//p' | tr -d '\r')
            done < <(find dist/ui0-qt -type f \( -iname '*.exe' -o -iname '*.dll' \) -print)
            [ "$added" -eq 1 ] || break
          done

          # Fail if any staged binary still names a UCRT64-provided dependency that has
          # not been copied. Windows system DLLs are intentionally not bundled.
          missing=0
          while IFS= read -r bin; do
            while IFS= read -r dep; do
              [ -n "$dep" ] || continue
              src=$(find /ucrt64/bin -maxdepth 1 -type f -iname "$dep" -print -quit || true)
              if [ -n "$src" ] && ! find dist/ui0-qt -type f -iname "$dep" -print -quit | grep -q .; then
                echo "ERROR: packaged runtime missing $dep required by $bin"
                missing=1
              fi
            done < <(objdump -p "$bin" 2>/dev/null | sed -n 's/^[[:space:]]*DLL Name:[[:space:]]*//p' | tr -d '\r')
          done < <(find dist/ui0-qt -type f \( -iname '*.exe' -o -iname '*.dll' \) -print)
          [ "$missing" -eq 0 ]

          sha256sum dist/ui0-qt/ECO_UI0_QT.exe > dist/ui0-qt/SHA256SUMS.txt
          find dist/ui0-qt -type f -printf '%P\n' | sort > dist/ui0-qt/PACKAGE_CONTENTS.txt
      - name: Clean-Windows launch smoke — Qt
        shell: pwsh
        run: |
          $savedPath = $env:PATH
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            $exe = (Resolve-Path 'dist/ui0-qt/ECO_UI0_QT.exe').Path
            $p = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
            Start-Sleep -Seconds 5
            if ($p.HasExited) {
              throw "Packaged Qt UI-0 exited during clean-runtime launch smoke. Exit code: $($p.ExitCode)"
            }
            Stop-Process -Id $p.Id -Force
          }
          finally {
            $env:PATH = $savedPath
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ECO_UI0_QT_WINDOWS
          path: dist/ui0-qt
          if-no-files-found: error
          retention-days: 7

  slint-windows:
    name: Slint 1.17 Windows build
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Toolchain identity
        shell: pwsh
        run: |
          rustc --version
          cargo --version
      - name: Build Slint UI-0
        shell: pwsh
        env:
          SLINT_BACKEND: winit-software
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --manifest-path prototypes/ui0/slint/Cargo.toml
      - name: Preserve resolved Slint dependency lock
        shell: pwsh
        run: Copy-Item prototypes/ui0/slint/Cargo.lock prototypes/ui0/slint/Cargo.lock.resolved
      - name: Stage Slint UI-0
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/ui0-slint | Out-Null
          Copy-Item prototypes/ui0/slint/target/release/eco-ui0-slint.exe dist/ui0-slint/ECO_UI0_SLINT.exe
          Copy-Item prototypes/ui0/slint/Cargo.lock.resolved dist/ui0-slint/Cargo.lock.resolved
          (Get-FileHash dist/ui0-slint/ECO_UI0_SLINT.exe -Algorithm SHA256).Hash.ToLower() + '  ECO_UI0_SLINT.exe' | Set-Content dist/ui0-slint/SHA256SUMS.txt -Encoding ascii
      - name: Clean-Windows launch smoke — Slint
        shell: pwsh
        run: |
          $savedPath = $env:PATH
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            $exe = (Resolve-Path 'dist/ui0-slint/ECO_UI0_SLINT.exe').Path
            $p = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
            Start-Sleep -Seconds 5
            if ($p.HasExited) {
              throw "Packaged Slint UI-0 exited during clean-runtime launch smoke. Exit code: $($p.ExitCode)"
            }
            Stop-Process -Id $p.Id -Force
          }
          finally {
            $env:PATH = $savedPath
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ECO_UI0_SLINT_WINDOWS
          path: dist/ui0-slint
          if-no-files-found: error
          retention-days: 7
