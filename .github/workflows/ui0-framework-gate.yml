name: UI-0 framework gate

on:
  pull_request:
    paths:
      - 'prototypes/ui0/**'
      - '.github/workflows/ui0-framework-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eco-ui0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qt-build:
    name: Qt 6 / QML Windows build + package
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
      - name: Configure and build Qt UI-0
        shell: msys2 {0}
        run: |
          cmake -S prototypes/ui0/qt -B build/ui0-qt -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ui0-qt --config Release
      - name: Deploy complete Qt UI-0 runtime closure
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p dist/ui0-qt/qml
          cp build/ui0-qt/ECO_UI0_QT.exe dist/ui0-qt/
          windeployqt --release --no-translations dist/ui0-qt/ECO_UI0_QT.exe

          # Main.qml is compiled into the executable. Qt Quick Controls and style modules
          # remain dynamic in this architecture proof, so preserve the required module trees.
          cp -R /ucrt64/share/qt6/qml/QtQuick dist/ui0-qt/qml/
          cp -R /ucrt64/share/qt6/qml/QtQml dist/ui0-qt/qml/

          # Close the full MinGW/UCRT64 transitive dependency graph once, using a queue,
          # rather than repeated filesystem scans. This permanently covers the Acer failure
          # class (libpng, md4c, freetype, harfbuzz and any dependencies they themselves need).
          python prototypes/ui0/qt/close_runtime.py dist/ui0-qt /ucrt64/bin

          sha256sum dist/ui0-qt/ECO_UI0_QT.exe > dist/ui0-qt/SHA256SUMS.txt
          find dist/ui0-qt -type f -printf '%P\n' | sort > dist/ui0-qt/PACKAGE_CONTENTS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ECO_UI0_QT_WINDOWS
          path: dist/ui0-qt
          if-no-files-found: error
          retention-days: 7

  qt-clean-launch:
    name: Qt clean Windows consumer launch
    needs: qt-build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      # Deliberately no checkout, compiler, Qt or MSYS2 setup in this job. It receives only
      # the packaged artifact produced on the separate build VM.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ECO_UI0_QT_WINDOWS
          path: consumer/qt
      - name: Verify expected Acer-regression DLLs are present
        shell: pwsh
        run: |
          $required = @('libpng16-16.dll','libmd4c.dll','libfreetype-6.dll','libharfbuzz-0.dll')
          foreach ($dll in $required) {
            if (-not (Get-ChildItem -Path consumer/qt -Recurse -File -Filter $dll -ErrorAction SilentlyContinue)) {
              throw "Packaged Qt artifact is missing Acer regression dependency: $dll"
            }
          }
      - name: Launch packaged Qt with clean consumer PATH
        shell: pwsh
        run: |
          $savedPath = $env:PATH
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            $exe = (Resolve-Path 'consumer/qt/ECO_UI0_QT.exe').Path
            $p = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
            Start-Sleep -Seconds 8
            if ($p.HasExited) {
              throw "Packaged Qt UI-0 exited on the separate consumer VM. Exit code: $($p.ExitCode)"
            }
            $proc = Get-Process -Id $p.Id -ErrorAction Stop
            if (-not $proc.MainWindowHandle) {
              throw "Packaged Qt UI-0 process stayed alive but did not expose a main window on the consumer VM."
            }
            "PASS: Qt package launched on separate Windows consumer VM; PID=$($p.Id); HWND=$($proc.MainWindowHandle)"
            Stop-Process -Id $p.Id -Force
          }
          finally {
            $env:PATH = $savedPath
          }

  slint-build:
    name: Slint 1.17 Windows build + package
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Toolchain identity
        shell: pwsh
        run: |
          rustc --version
          cargo --version
      - name: Build Slint UI-0
        shell: pwsh
        env:
          SLINT_BACKEND: winit-software
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --manifest-path prototypes/ui0/slint/Cargo.toml
      - name: Preserve resolved Slint dependency lock
        shell: pwsh
        run: Copy-Item prototypes/ui0/slint/Cargo.lock prototypes/ui0/slint/Cargo.lock.resolved
      - name: Stage Slint UI-0
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/ui0-slint | Out-Null
          Copy-Item prototypes/ui0/slint/target/release/eco-ui0-slint.exe dist/ui0-slint/ECO_UI0_SLINT.exe
          Copy-Item prototypes/ui0/slint/Cargo.lock.resolved dist/ui0-slint/Cargo.lock.resolved
          (Get-FileHash dist/ui0-slint/ECO_UI0_SLINT.exe -Algorithm SHA256).Hash.ToLower() + '  ECO_UI0_SLINT.exe' | Set-Content dist/ui0-slint/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ECO_UI0_SLINT_WINDOWS
          path: dist/ui0-slint
          if-no-files-found: error
          retention-days: 7

  slint-clean-launch:
    name: Slint clean Windows consumer launch
    needs: slint-build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      # Deliberately separate consumer VM: no checkout, Rust or build setup.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ECO_UI0_SLINT_WINDOWS
          path: consumer/slint
      - name: Launch packaged Slint with clean consumer PATH
        shell: pwsh
        run: |
          $savedPath = $env:PATH
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            $exe = (Resolve-Path 'consumer/slint/ECO_UI0_SLINT.exe').Path
            $p = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
            Start-Sleep -Seconds 8
            if ($p.HasExited) {
              throw "Packaged Slint UI-0 exited on the separate consumer VM. Exit code: $($p.ExitCode)"
            }
            $proc = Get-Process -Id $p.Id -ErrorAction Stop
            if (-not $proc.MainWindowHandle) {
              throw "Packaged Slint UI-0 process stayed alive but did not expose a main window on the consumer VM."
            }
            "PASS: Slint package launched on separate Windows consumer VM; PID=$($p.Id); HWND=$($proc.MainWindowHandle)"
            Stop-Process -Id $p.Id -Force
          }
          finally {
            $env:PATH = $savedPath
          }
