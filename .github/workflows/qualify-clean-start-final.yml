name: Qualify corrected clean-start integration
on:
  push:
    branches: [integration/restore-forced-stop-restart-20260905]
    paths: [.github/workflows/qualify-clean-start-final.yml]
permissions:
  contents: write
jobs:
  qualify:
    if: github.ref == 'refs/heads/integration/restore-forced-stop-restart-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: false
      - name: Correct the startup expectation and rerun the exact bounded qualifier
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .github/workflows/qualify-explicit-clean-start.yml)" = '629c9291fb932c119b455553021d03d8f2a8fbb5'
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p = Path('cmd/eco/ui_regression_test.go')
          s = p.read_text()
          old = '"ArchiveDevelopmentWorkspaceForCleanStart"'
          assert s.count(old) == 1
          s = s.replace(old, '"StartCleanDevelopmentWorkspace", "CheckWorkspaceRecoveryState"', 1)
          p.write_text(s)
          subprocess.run(['gofmt', '-w', str(p)], check=True)
          # Reuse only the four reviewed run blocks of the pinned temporary
          # qualifier. Both temporary workflow files are removed before merge.
          lines = Path('.github/workflows/qualify-explicit-clean-start.yml').read_text().splitlines()
          scripts = []
          i = 0
          while i < len(lines):
              if lines[i] == '        run: |':
                  i += 1
                  block = []
                  while i < len(lines) and (lines[i].startswith('          ') or not lines[i].strip()):
                      block.append(lines[i][10:] if lines[i].startswith('          ') else '')
                      i += 1
                  scripts.append('\n'.join(block) + '\n')
              else:
                  i += 1
          assert len(scripts) == 4
          assert 'Reproduce' not in scripts[0] and 'TestExplicitCleanPriorRestoreRegression' in scripts[0]
          assert 'startCleanDevelopmentWorkspace' in scripts[1]
          assert 'go test -count=1 ./...' in scripts[2]
          assert 'git push' in scripts[3]
          scripts[3] = scripts[3].replace("receipt={'run_id':", "receipt={'earlier_qualification_failure':'33976047764: all 17 selected cases passed; full suite stopped because UI source-regression expected archive-only call rather than combined clean start. No product commit occurred in that run.','run_id':", 1)
          scripts[3] = scripts[3].replace('git add internal/eco/vault.go', 'git add cmd/eco/ui_regression_test.go internal/eco/vault.go', 1)
          for number, script in enumerate(scripts, 1):
              print(f'::group::Bounded qualification stage {number}', flush=True)
              subprocess.run(['bash', '-euo', 'pipefail', '-c', script], check=True)
              print('::endgroup::', flush=True)
          PY
