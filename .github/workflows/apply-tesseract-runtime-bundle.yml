name: Apply verified Tesseract runtime bundle integration

on:
  push:
    branches:
      - integration/tesseract-runtime-bundle-20260904
    paths:
      - .github/workflows/apply-tesseract-runtime-bundle.yml
      - scripts/apply_tesseract_runtime_bundle.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: integration/tesseract-runtime-bundle-20260904
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23.12'
          cache: false
      - name: Apply Tesseract runtime integration
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_tesseract_runtime_bundle.py
          gofmt -w internal/eco/tesseract_bundle.go internal/eco/tesseract_bundle_test.go internal/eco/tesseract_adapter.go internal/eco/tesseract_workflow.go internal/eco/local_tools.go cmd/eco/main_windows.go
          go test ./...
          go vet ./...
          python3 scripts/check_source_policy.py
          git diff --check
          git config user.name 'ECO GitHub integration bot'
          git config user.email 'actions@users.noreply.github.com'
          git add internal/eco/tesseract_bundle.go internal/eco/tesseract_bundle_test.go internal/eco/tesseract_adapter.go internal/eco/tesseract_workflow.go internal/eco/local_tools.go cmd/eco/main_windows.go docs/foss/TESSERACT_RUNTIME_BUNDLE_INTEGRATION.md
          git commit -m 'Integrate verified Tesseract runtime bundle [tesseract-wave4-runtime]'
          git push origin HEAD:integration/tesseract-runtime-bundle-20260904
