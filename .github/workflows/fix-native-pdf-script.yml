name: Repair native PDF integration script

on:
  push:
    branches:
      - integration/native-pdf-reader-20260904
    paths:
      - .github/workflows/fix-native-pdf-script.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: integration/native-pdf-reader-20260904
          fetch-depth: 0
      - name: Repair raw-template indentation conversion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_native_pdf_reader.sh')
          s = p.read_text(encoding='utf-8')
          needle = "s = s.replace(func_anchor, pdf_func + func_anchor, 1)"
          replacement = "pdf_func = pdf_func.replace(r'\\t', '\\t')\n" + needle
          if replacement in s:
              raise SystemExit('repair already present')
          if needle not in s:
              raise SystemExit('expected insertion anchor not found')
          p.write_text(s.replace(needle, replacement, 1), encoding='utf-8')
          PY
          git diff --check
          git config user.name 'ECO GitHub integration bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/apply_native_pdf_reader.sh
          git commit -m 'Fix native PDF generator indentation'
          git push origin HEAD:integration/native-pdf-reader-20260904
