name: P2 native Win32 accessibility spike

on:
  push:
    branches: [ dev/p2-presentation-bakeoff-20260808 ]
    paths:
      - 'labs/native_win32_accessibility_spike/**'
      - '.github/workflows/p2-native-win32-accessibility-spike.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p2-native-win32-a11y-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-win32-accessibility:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.23.x'
          cache: false

      - name: Prove bounded dependency surface
        working-directory: labs/native_win32_accessibility_spike
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $modules = @(go list -m all)
          $modules | ForEach-Object { Write-Host $_ }
          if ($modules.Count -ne 1) {
            throw "Native spike unexpectedly has third-party Go module dependencies: $($modules -join ', ')"
          }
          if (Get-ChildItem -Recurse -File | Select-String -Pattern 'net/http|WinHTTP|WinInet|https?://' -CaseSensitive:$false) {
            throw 'Native spike contains an unexpected network-capable dependency or URL.'
          }
          Write-Host 'ECO_GATE native_win32_dependency_surface=PASS_STDLIB_ONLY'

      - name: Vet and build one-file no-CGo Windows GUI
        working-directory: labs/native_win32_accessibility_spike
        shell: pwsh
        env:
          CGO_ENABLED: '0'
        run: |
          $ErrorActionPreference = 'Stop'
          go vet ./...
          $exe = "$env:RUNNER_TEMP\eco-native-a11y-spike.exe"
          go build -trimpath -ldflags '-H windowsgui' -o $exe .
          if (-not (Test-Path $exe)) { throw 'Native Win32 spike executable was not built.' }
          $item = Get-Item $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "ECO_NATIVE_EXE_SIZE=$($item.Length)"
          Write-Host "ECO_NATIVE_EXE_SHA256=$hash"
          go version -m $exe
          Write-Host 'ECO_GATE native_win32_one_file_cgo0_build=PASS'

      - name: Prove standard Win32 controls expose direct MSAA contracts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName Accessibility
          $accessibilityAssembly = [Accessibility.IAccessible].Assembly.Location
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;

          public sealed class EcoMsaaInfo
          {
              public IntPtr Hwnd { get; set; }
              public string ClassName { get; set; }
              public string WindowText { get; set; }
              public string AccessibleName { get; set; }
              public string AccessibleValue { get; set; }
              public string DefaultAction { get; set; }
              public int Role { get; set; }
              public int State { get; set; }
          }

          public static class EcoOleAccProbe
          {
              private const uint OBJID_CLIENT = 0xFFFFFFFC;

              [DllImport("user32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
              private static extern IntPtr FindWindowEx(IntPtr hwndParent, IntPtr hwndChildAfter, string lpszClass, string lpszWindow);

              [DllImport("oleacc.dll")]
              private static extern int AccessibleObjectFromWindow(
                  IntPtr hwnd,
                  uint dwId,
                  ref Guid riid,
                  [MarshalAs(UnmanagedType.Interface)] out Accessibility.IAccessible ppvObject);

              private static Accessibility.IAccessible AccessibleFor(IntPtr hwnd)
              {
                  Guid iid = typeof(Accessibility.IAccessible).GUID;
                  Accessibility.IAccessible acc;
                  int hr = AccessibleObjectFromWindow(hwnd, OBJID_CLIENT, ref iid, out acc);
                  if (hr < 0) Marshal.ThrowExceptionForHR(hr);
                  if (acc == null) throw new InvalidOperationException("AccessibleObjectFromWindow returned no IAccessible object.");
                  return acc;
              }

              public static EcoMsaaInfo Inspect(IntPtr parent, string className, string windowText)
              {
                  IntPtr hwnd = FindWindowEx(parent, IntPtr.Zero, className, windowText);
                  if (hwnd == IntPtr.Zero)
                      throw new InvalidOperationException("Could not find Win32 child class='" + className + "' text='" + windowText + "'.");

                  Accessibility.IAccessible acc = AccessibleFor(hwnd);
                  object self = 0;
                  EcoMsaaInfo info = new EcoMsaaInfo();
                  info.Hwnd = hwnd;
                  info.ClassName = className;
                  info.WindowText = windowText;
                  info.Role = Convert.ToInt32(acc.get_accRole(self));
                  info.State = Convert.ToInt32(acc.get_accState(self));
                  try { info.AccessibleName = acc.get_accName(self); } catch { }
                  try { info.AccessibleValue = acc.get_accValue(self); } catch { }
                  try { info.DefaultAction = acc.get_accDefaultAction(self); } catch { }
                  return info;
              }

              public static void DoDefaultAction(IntPtr parent, string className, string windowText)
              {
                  IntPtr hwnd = FindWindowEx(parent, IntPtr.Zero, className, windowText);
                  if (hwnd == IntPtr.Zero)
                      throw new InvalidOperationException("Could not find Win32 child for default action.");
                  AccessibleFor(hwnd).accDoDefaultAction(0);
              }
          }
          '@ -ReferencedAssemblies $accessibilityAssembly

          $exe = "$env:RUNNER_TEMP\eco-native-a11y-spike.exe"
          $handleFile = "$env:RUNNER_TEMP\eco-native-msaa-hwnd.txt"
          Remove-Item $handleFile -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe -ArgumentList @('--handle-file', $handleFile) -PassThru

          try {
            $deadline = (Get-Date).AddSeconds(20)
            while (-not (Test-Path $handleFile) -and (Get-Date) -lt $deadline -and -not $p.HasExited) {
              Start-Sleep -Milliseconds 200
              $p.Refresh()
            }
            if ($p.HasExited) { throw "Native Win32 spike exited before MSAA inspection. Exit code: $($p.ExitCode)" }
            if (-not (Test-Path $handleFile)) { throw 'Native Win32 spike did not publish a window handle for MSAA inspection.' }

            $raw = [UInt64]::Parse((Get-Content $handleFile -Raw).Trim())
            $hwnd = New-Object IntPtr ([Int64]$raw)

            $ROLE_SYSTEM_STATICTEXT = 0x29
            $ROLE_SYSTEM_TEXT = 0x2A
            $ROLE_SYSTEM_PUSHBUTTON = 0x2B
            $ROLE_SYSTEM_LIST = 0x21
            $STATE_SYSTEM_FOCUSABLE = 0x00100000

            $workspace = [EcoOleAccProbe]::Inspect($hwnd, 'Static', 'Matter Workspace')
            $workspaceNav = [EcoOleAccProbe]::Inspect($hwnd, 'Button', 'Workspace')
            $documentsNav = [EcoOleAccProbe]::Inspect($hwnd, 'Button', 'Documents')
            $review = [EcoOleAccProbe]::Inspect($hwnd, 'Button', 'Review evidence')
            $ask = [EcoOleAccProbe]::Inspect($hwnd, 'Button', 'Ask ECO')
            $edit = [EcoOleAccProbe]::Inspect($hwnd, 'Edit', $null)
            $list = [EcoOleAccProbe]::Inspect($hwnd, 'ListBox', $null)

            @($workspace, $workspaceNav, $documentsNav, $review, $ask, $edit, $list) |
              Select-Object Hwnd,ClassName,WindowText,AccessibleName,AccessibleValue,DefaultAction,Role,State |
              Format-Table -AutoSize | Out-String | Write-Host

            if ($workspace.Role -ne $ROLE_SYSTEM_STATICTEXT) { throw "Matter Workspace MSAA role was $($workspace.Role), expected static text $ROLE_SYSTEM_STATICTEXT." }
            foreach ($button in @($workspaceNav, $documentsNav, $review, $ask)) {
              if ($button.Role -ne $ROLE_SYSTEM_PUSHBUTTON) { throw "Button '$($button.WindowText)' MSAA role was $($button.Role), expected $ROLE_SYSTEM_PUSHBUTTON." }
              if (($button.State -band $STATE_SYSTEM_FOCUSABLE) -eq 0) { throw "Button '$($button.WindowText)' is not exposed as focusable through MSAA." }
              if ([string]::IsNullOrWhiteSpace($button.AccessibleName)) { throw "Button '$($button.WindowText)' has no MSAA accessible name." }
            }
            if ($edit.Role -ne $ROLE_SYSTEM_TEXT) { throw "Search EDIT MSAA role was $($edit.Role), expected text/edit $ROLE_SYSTEM_TEXT." }
            if (($edit.State -band $STATE_SYSTEM_FOCUSABLE) -eq 0) { throw 'Search EDIT is not exposed as focusable through MSAA.' }
            if ($list.Role -ne $ROLE_SYSTEM_LIST) { throw "Evidence LISTBOX MSAA role was $($list.Role), expected list $ROLE_SYSTEM_LIST." }
            if (($list.State -band $STATE_SYSTEM_FOCUSABLE) -eq 0) { throw 'Evidence LISTBOX is not exposed as focusable through MSAA.' }

            [EcoOleAccProbe]::DoDefaultAction($hwnd, 'Button', 'Review evidence')
            Start-Sleep -Milliseconds 150
            Write-Host 'ECO_GATE native_win32_msaa_roles=PASS_STATIC_BUTTON_EDIT_LIST'
            Write-Host 'ECO_GATE native_win32_msaa_names=PASS_BUTTON_NAMES'
            Write-Host 'ECO_GATE native_win32_msaa_focusability=PASS_BUTTON_EDIT_LIST'
            Write-Host 'ECO_GATE native_win32_msaa_default_action=PASS_REVIEW_BUTTON'
          }
          finally {
            if ($p -and -not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Diagnose hosted Windows UI Automation proxy mapping
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type -AssemblyName UIAutomationClientsideProviders

          try {
            $providerType = [Type]::GetType('UIAutomationClientsideProviders.UIAutomationClientSideProviders, UIAutomationClientsideProviders', $false)
            if ($providerType) {
              $table = $providerType.GetProperty('ClientSideProviderDescriptionTable', [Reflection.BindingFlags]'Public,Static').GetValue($null)
              if ($table) {
                [System.Windows.Automation.ClientSettings]::RegisterClientSideProviders($table)
                Write-Host 'Registered Microsoft client-side UIA provider table explicitly.'
              }
            }
          } catch {
            Write-Host "Explicit UIA provider registration was unavailable: $($_.Exception.Message)"
          }

          $exe = "$env:RUNNER_TEMP\eco-native-a11y-spike.exe"
          $handleFile = "$env:RUNNER_TEMP\eco-native-uia-hwnd.txt"
          Remove-Item $handleFile -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe -ArgumentList @('--handle-file', $handleFile) -PassThru

          try {
            $deadline = (Get-Date).AddSeconds(20)
            while (-not (Test-Path $handleFile) -and (Get-Date) -lt $deadline -and -not $p.HasExited) {
              Start-Sleep -Milliseconds 200
              $p.Refresh()
            }
            if ($p.HasExited -or -not (Test-Path $handleFile)) {
              Write-Host 'ECO_GATE native_win32_hosted_uia=INCONCLUSIVE_NO_LIVE_WINDOW'
              exit 0
            }

            $raw = [UInt64]::Parse((Get-Content $handleFile -Raw).Trim())
            $hwnd = New-Object IntPtr ([Int64]$raw)
            $root = [System.Windows.Automation.AutomationElement]::FromHandle($hwnd)
            if ($null -eq $root) {
              Write-Host 'ECO_GATE native_win32_hosted_uia=INCONCLUSIVE_NO_UIA_ROOT'
              exit 0
            }

            $all = $root.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)
            $rows = @()
            foreach ($el in $all) {
              try {
                $rows += [pscustomobject]@{
                  Name = $el.Current.Name
                  Type = $el.Current.ControlType.ProgrammaticName
                  ClassName = $el.Current.ClassName
                  Framework = $el.Current.FrameworkId
                  NativeHandle = $el.Current.NativeWindowHandle
                  Focusable = $el.Current.IsKeyboardFocusable
                }
              } catch {}
            }
            $rows | ConvertTo-Json -Depth 3 | Write-Host

            $review = @($rows | Where-Object { $_.Name -eq 'Review evidence' }) | Select-Object -First 1
            $edit = @($rows | Where-Object { $_.ClassName -eq 'Edit' }) | Select-Object -First 1
            $list = @($rows | Where-Object { $_.ClassName -eq 'ListBox' }) | Select-Object -First 1
            if ($review.Type -eq 'ControlType.Button' -and $edit.Type -eq 'ControlType.Edit' -and $list.Type -eq 'ControlType.List') {
              Write-Host 'ECO_GATE native_win32_hosted_uia=PASS_STANDARD_PROXY_MAPPING'
            } else {
              Write-Host 'GitHub-hosted Windows Server exposed the real Win32 HWNDs but did not map standard-control UIA proxy roles in this session.'
              Write-Host 'Direct MSAA is the CI accessibility contract gate; physical Windows 11 UIA/NVDA/Narrator validation remains mandatory before production promotion.'
              Write-Host 'ECO_GATE native_win32_hosted_uia=INCONCLUSIVE_STANDARD_CONTROLS_FLATTENED_TO_PANES'
            }
          }
          finally {
            if ($p -and -not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Prove no runnable build artifact is published
        shell: pwsh
        run: |
          if (Select-String -Path '.github\workflows\p2-native-win32-accessibility-spike.yml' -Pattern 'actions/upload-artifact@') {
            throw 'Public workflow artifact upload is forbidden for this spike.'
          }
          Write-Host 'ECO_GATE native_win32_public_binary_upload=ABSENT'
