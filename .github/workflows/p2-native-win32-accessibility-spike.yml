name: P2 native Win32 accessibility spike

on:
  push:
    branches: [ dev/p2-presentation-bakeoff-20260808 ]
    paths:
      - 'labs/native_win32_accessibility_spike/**'
      - '.github/workflows/p2-native-win32-accessibility-spike.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p2-native-win32-a11y-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-win32-accessibility:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.23.x'
          cache: false

      - name: Prove bounded dependency surface
        working-directory: labs/native_win32_accessibility_spike
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $modules = @(go list -m all)
          $modules | ForEach-Object { Write-Host $_ }
          if ($modules.Count -ne 1) {
            throw "Unexpected third-party Go modules: $($modules -join ', ')"
          }
          $source = Get-ChildItem -File -Filter '*.go'
          if ($source | Select-String -Pattern 'net/http|WinHTTP|WinInet|https?://' -CaseSensitive:$false) {
            throw 'Native presentation spike contains an unexpected network-capable API or URL.'
          }
          Write-Host 'ECO_GATE native_win32_dependency_surface=PASS_STDLIB_ONLY'

      - name: Vet and build one-file no-CGo Windows GUI
        working-directory: labs/native_win32_accessibility_spike
        shell: pwsh
        env:
          CGO_ENABLED: '0'
        run: |
          $ErrorActionPreference = 'Stop'
          go vet ./...
          $exe = "$env:RUNNER_TEMP\eco-native-a11y-spike.exe"
          go build -trimpath -ldflags '-H windowsgui' -o $exe .
          if (-not (Test-Path $exe)) { throw 'Native Win32 spike executable was not built.' }
          $item = Get-Item $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "ECO_NATIVE_EXE_SIZE=$($item.Length)"
          Write-Host "ECO_NATIVE_EXE_SHA256=$hash"
          go version -m $exe
          Write-Host 'ECO_GATE native_win32_one_file_cgo0_build=PASS'

      - name: Prove MSAA roles names focusability and default action
        shell: powershell
        run: |
          & '.\labs\native_win32_accessibility_spike\probe_accessibility.ps1' `
            -ExePath "$env:RUNNER_TEMP\eco-native-a11y-spike.exe" `
            -TempRoot "$env:RUNNER_TEMP"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prove no runnable build artifact is published
        shell: pwsh
        run: |
          $pattern = '^\s*uses:\s+actions/upload-artifact@'
          $hit = Select-String -Path '.github\workflows\p2-native-win32-accessibility-spike.yml' -Pattern $pattern
          if ($hit) {
            throw 'Public workflow artifact upload is forbidden for this spike.'
          }
          Write-Host 'ECO_GATE native_win32_public_binary_upload=ABSENT'
