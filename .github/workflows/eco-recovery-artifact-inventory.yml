name: ECO recovery artifact inventory

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/eco-recovery-artifact-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inventory:
    name: Inventory historical private artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact tested ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Enumerate all live repository artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery-inventory
          page=1
          printf '[]' > recovery-inventory/all-artifacts.json
          while :; do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&page=${page}" \
              > "recovery-inventory/page-${page}.json"
            count=$(jq '.artifacts | length' "recovery-inventory/page-${page}.json")
            jq -s '.[0] + .[1].artifacts' \
              recovery-inventory/all-artifacts.json \
              "recovery-inventory/page-${page}.json" \
              > recovery-inventory/next.json
            mv recovery-inventory/next.json recovery-inventory/all-artifacts.json
            if [ "$count" -lt 100 ]; then break; fi
            page=$((page + 1))
          done
          jq 'sort_by(.created_at) | reverse' recovery-inventory/all-artifacts.json \
            > recovery-inventory/all-artifacts-sorted.json
          jq '[.[] | select((.name | ascii_downcase | contains("v38")) or (.name | ascii_downcase | contains("source")) or (.name | ascii_downcase | contains("maintenance")) or (.created_at >= "2026-08-02T00:00:00Z" and .created_at < "2026-08-04T00:00:00Z"))]' \
            recovery-inventory/all-artifacts-sorted.json \
            > recovery-inventory/recovery-candidates.json
          jq -r '(["id","name","size_in_bytes","expired","created_at","expires_at","head_branch","head_sha","archive_download_url"] | @csv), (.[] | [.id,.name,.size_in_bytes,.expired,.created_at,.expires_at,.workflow_run.head_branch,.workflow_run.head_sha,.archive_download_url] | @csv)' \
            recovery-inventory/recovery-candidates.json \
            > recovery-inventory/recovery-candidates.csv
          echo '=== RECOVERY CANDIDATES ==='
          cat recovery-inventory/recovery-candidates.csv

      - name: Upload inventory only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ECO_RECOVERY_ARTIFACT_INVENTORY
          path: |
            recovery-inventory/all-artifacts-sorted.json
            recovery-inventory/recovery-candidates.json
            recovery-inventory/recovery-candidates.csv
          compression-level: 9
          retention-days: 1
          if-no-files-found: error
