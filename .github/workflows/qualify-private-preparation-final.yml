name: Qualify private preparation final controls
on:
  push:
    branches: [integration/private-local-build-handoff-20260905]
    paths: [.github/workflows/qualify-private-preparation-final.yml]
permissions:
  contents: write
jobs:
  qualify:
    if: github.ref == 'refs/heads/integration/private-local-build-handoff-20260905'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Re-run the pinned four qualification stages with explicit expected-failure completion
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path='.github/workflows/qualify-private-preparation-review-fix.yml'
          $hash=& git hash-object $path
          if ($LASTEXITCODE -ne 0 -or $hash -cne 'c791d36cc4dcdfdd98377e596bc643c2b9ccd77d') { throw 'Pinned qualifier changed.' }
          $lines=[IO.File]::ReadAllLines((Join-Path $PWD $path))
          $blocks=New-Object 'System.Collections.Generic.List[string]'
          for ($i=0;$i -lt $lines.Length;$i++) {
              if ($lines[$i] -eq '        run: |') {
                  $i++
                  $body=New-Object 'System.Collections.Generic.List[string]'
                  while ($i -lt $lines.Length -and ($lines[$i].StartsWith('          ') -or -not $lines[$i].Trim())) {
                      if ($lines[$i].StartsWith('          ')) { $body.Add($lines[$i].Substring(10)) } else { $body.Add('') }
                      $i++
                  }
                  $blocks.Add(($body -join "`n"));$i--
              }
          }
          if ($blocks.Count -ne 4) { throw 'Expected exactly four reviewed stages.' }
          if (-not $blocks[2].Contains("Write-Host 'Failed post-build validation: candidate directory ABSENT; stopped result PASS.'")) { throw 'Negative-test acceptance marker changed.' }
          # Only AFTER every negative-test assertion passes, clear its expected
          # child exit 1 so the runner does not misreport successful refusal.
          $blocks[2]+="`n`$global:LASTEXITCODE=0`n"
          $blocks[3]=$blocks[3].Replace('run_id=$env:GITHUB_RUN_ID;input_head=$env:GITHUB_SHA',"run_id=`$env:GITHUB_RUN_ID;input_head=`$env:GITHUB_SHA;earlier_harness_failure='33981390904: all controls passed including wrong-hash candidate absence; the expected child exit 1 then propagated through the runner shell and prevented product commit. This run resets that code only after the assertions.'")
          for ($n=0;$n -lt $blocks.Count;$n++) {
              Write-Host ('::group::Private preparation qualification stage '+($n+1))
              & ([ScriptBlock]::Create($blocks[$n]))
              if ($LASTEXITCODE -ne 0) { throw ('Unexpected native failure after stage '+($n+1)) }
              Write-Host '::endgroup::'
          }
