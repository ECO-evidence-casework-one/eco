name: Qualify explicit clean-start and reset restart
on:
  push:
    branches: [integration/restore-forced-stop-restart-20260905]
    paths: [.github/workflows/qualify-explicit-clean-start.yml]
permissions:
  contents: write
jobs:
  qualify:
    if: github.ref == 'refs/heads/integration/restore-forced-stop-restart-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: false
      - name: Reproduce intentional-reset compatibility failure before repair
        shell: bash
        run: |
          set -euo pipefail
          cat > internal/eco/explicit_clean_regression_test.go <<'GO'
          package eco
          import ("os"; "testing")
          func TestExplicitCleanPriorRestoreRegression(t *testing.T) {
            f := newRollbackFixture(t)
            if err := f.active.Close(); err != nil { t.Fatal(err) }
            if err := os.Mkdir(f.root+".pre-restore-historical",0700); err != nil { t.Fatal(err) }
            if _,err:=ArchiveDevelopmentWorkspaceForCleanStart(f.root); err!=nil { t.Fatal(err) }
            fresh,err:=OpenVault(f.root)
            if err!=nil { t.Fatalf("intentional Start clean cannot complete after prior restore: %v",err) }
            defer fresh.Close()
            if len(fresh.Snapshot().Matters)!=0 { t.Fatal("clean start inherited state") }
          }
          GO
          set +e
          go test -count=1 -json -run '^TestExplicitCleanPriorRestoreRegression$' ./internal/eco > "$RUNNER_TEMP/clean-before.jsonl" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/clean-before.jsonl"
          test "$result" -eq 1
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=[]
          for line in Path(os.environ['RUNNER_TEMP'],'clean-before.jsonl').read_text().splitlines():
              try: rows.append(json.loads(line))
              except json.JSONDecodeError: pass
          assert any(r.get('Action')=='fail' and r.get('Test')=='TestExplicitCleanPriorRestoreRegression' for r in rows)
          assert any('intentional Start clean cannot complete after prior restore' in r.get('Output','') for r in rows)
          PY
          rm internal/eco/explicit_clean_regression_test.go
      - name: Add explicit creation transaction and bounded reset tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          def once(s,old,new):
              assert s.count(old)==1, repr(old)
              return s.replace(old,new,1)
          p=Path('internal/eco/vault.go')
          s=p.read_text()
          s=once(s,'\troot = owner.root\n\tv := &Vault{', '\treturn openOwnedVault(owner, false)\n}\n\n// allowFresh is reserved for an identity-checked directory newly created by\n// the explicit clean-start operation. Ordinary opens never bypass recovery.\nfunc openOwnedVault(owner *workspaceOwnerLease, allowFresh bool) (*Vault, error) {\n\troot := owner.root\n\tv := &Vault{')
          start=s.index('func openOwnedVault(')
          before,tail=s[:start],s[start:]
          old='\tif err := CheckWorkspaceRecoveryState(root); err != nil {\n\t\treturn nil, err\n\t}'
          tail=once(tail,old,'\tif !allowFresh {\n\t\tif err := CheckWorkspaceRecoveryState(root); err != nil {\n\t\t\treturn nil, err\n\t\t}\n\t}')
          p.write_text(before+tail)
          p=Path('internal/eco/restore_restart.go')
          s=p.read_text()
          s=once(s,'// Reset (.previous-*) recovery is deliberately outside this restore-only slice.','// A retained .previous-* reset archive likewise requires an explicit choice.')
          s=once(s,'prefix := filepath.Base(absolute) + ".pre-restore-"','prefixes := []string{filepath.Base(absolute) + ".pre-restore-", filepath.Base(absolute) + ".previous-"}')
          old='\t\t\tmatches := strings.HasPrefix(name, prefix)\n\t\t\tif runtime.GOOS == "windows" {\n\t\t\t\tmatches = strings.HasPrefix(strings.ToLower(name), strings.ToLower(prefix))\n\t\t\t}'
          new='\t\t\tmatches := false\n\t\t\tfor _, prefix := range prefixes {\n\t\t\t\tif runtime.GOOS == "windows" {\n\t\t\t\t\tmatches = matches || strings.HasPrefix(strings.ToLower(name), strings.ToLower(prefix))\n\t\t\t\t} else {\n\t\t\t\t\tmatches = matches || strings.HasPrefix(name, prefix)\n\t\t\t\t}\n\t\t\t}'
          s=once(s,old,new)
          s=s.replace('but a pre-restore entry remains at','but a retained workspace checkpoint remains at')
          p.write_text(s)
          p=Path('internal/eco/development_workspace.go')
          s=once(p.read_text(),'// never deletes the workspace. A later OpenVault(root) can then create a fresh\n// candidate workspace at the original route.','// never deletes the workspace. OpenVault does not silently recreate an archived\n// route. Use StartCleanDevelopmentWorkspace for an explicitly requested fresh\n// workspace, or OpenVault(archive) to select the preserved prior state.')
          p.write_text(s)
          p=Path('cmd/eco/main_windows.go')
          s=once(p.read_text(),'archive, err := eco.ArchiveDevelopmentWorkspaceForCleanStart(candidate)','archive, err := eco.StartCleanDevelopmentWorkspace(candidate)')
          s=once(s,'A fresh candidate workspace will now be created.','A fresh candidate workspace has been created.')
          p.write_text(s)
          p=Path('internal/eco/development_workspace_test.go')
          s=p.read_text()
          anchor='\tfresh, err := OpenVault(root)\n'
          added='\trefused, refusal := OpenVault(root)\n\tif refused != nil { _ = refused.Close() }\n\tif !errors.Is(refusal, ErrWorkspaceRecoveryRequired) {\n\t\tt.Fatalf("archived route did not require an explicit new-state choice: %v", refusal)\n\t}\n\tif _, err := StartCleanDevelopmentWorkspace(root); err != nil { t.Fatal(err) }\n'
          s=once(s,anchor,added+anchor)
          p.write_text(s)
          p=Path('internal/eco/restore_forced_stop_test.go')
          s=once(p.read_text(),'cmd := exec.CommandContext(ctx, os.Args[0], "-test.run=^TestRestoreForcedStopChild$")','childTest := "TestRestoreForcedStopChild"\n\tif strings.HasPrefix(phase, "reset_") { childTest = "TestResetForcedStopChild" }\n\tcmd := exec.CommandContext(ctx, os.Args[0], "-test.run=^"+childTest+"$")')
          p.write_text(s)
          Path('internal/eco/explicit_clean_start.go').write_text(textwrap.dedent('''\
          package eco
          import ("errors"; "fmt"; "path/filepath")

          // StartCleanDevelopmentWorkspace is an explicit user-requested operation.
          // It preserves prior state, creates and owns a new directory, then writes
          // the fresh workspace before returning. A process stop cannot grant a
          // future ordinary OpenVault permission to silently initialise old state.
          func StartCleanDevelopmentWorkspace(root string) (string,error) {
            return startCleanDevelopmentWorkspace(root,nil)
          }

          // boundary is a per-call internal test observation seam, never set by UI.
          func startCleanDevelopmentWorkspace(root string,boundary func(string)) (string,error) {
            if root=="" { return "",errors.New("empty workspace root") }
            absolute,err:=filepath.Abs(root)
            if err!=nil { return "",err }
            archive,err:=ArchiveDevelopmentWorkspaceForCleanStart(absolute)
            if err!=nil { return archive,err }
            fail:=func(cause error)(string,error) {
              return archive,fmt.Errorf("explicit clean start did not finish; retain all workspace copies (archived route %q): %w",archive,cause)
            }
            if boundary!=nil { boundary("reset_archived") }
            creation,err:=acquireWorkspaceCreationOwner(absolute)
            if err!=nil { return fail(err) }
            defer creation.Close()
            created,err:=creation.createMissingHierarchy()
            if err!=nil { cleanupCreatedWorkspaceDirectories(created); return fail(err) }
            var identity workspaceObjectIdentity
            for _,entry:=range created { if entry.path==absolute { identity=entry.identity } }
            if !identity.valid() {
              cleanupCreatedWorkspaceDirectories(created)
              return fail(errors.New("clean-start route was not created by this operation"))
            }
            owner,err:=acquireWorkspaceRootOwner(absolute)
            if err!=nil { cleanupCreatedWorkspaceDirectories(created); return fail(err) }
            if !identity.equal(owner.identity) {
              _=owner.Close()
              return fail(errors.New("new clean-start directory identity changed"))
            }
            if err:=creation.revalidate();err!=nil { _=owner.Close();return fail(err) }
            fresh,err:=openOwnedVault(owner,true)
            if err!=nil { return fail(err) }
            defer fresh.Close()
            if boundary!=nil { boundary("reset_created") }
            if err:=fresh.Close();err!=nil { return fail(err) }
            return archive,nil
          }
          '''))
          Path('internal/eco/explicit_clean_start_test.go').write_text(textwrap.dedent('''\
          package eco
          import ("encoding/json";"errors";"io";"os";"path/filepath";"reflect";"strings";"testing")

          func TestExplicitCleanStartWithRestoreHistory(t *testing.T) {
            f:=newRollbackFixture(t)
            before:=f.active.Snapshot()
            if err:=f.active.Close();err!=nil { t.Fatal(err) }
            prior:=f.root+".pre-restore-historical"
            if err:=os.Mkdir(prior,0700);err!=nil { t.Fatal(err) }
            if err:=os.WriteFile(filepath.Join(prior,"retain.txt"),[]byte("synthetic retained history"),0600);err!=nil { t.Fatal(err) }
            retained:=workspaceFormatTree(t,prior)
            archive,err:=StartCleanDevelopmentWorkspace(f.root)
            if err!=nil { t.Fatal(err) }
            fresh,err:=OpenVault(f.root)
            if err!=nil { t.Fatal(err) }
            got:=fresh.Snapshot()
            _=fresh.Close()
            if len(got.Matters)!=0 || len(got.Evidence)!=0 || len(got.Questions)!=0 { t.Fatal("explicit new workspace inherited old state") }
            if !reflect.DeepEqual(retained,workspaceFormatTree(t,prior)) { t.Fatal("clean start changed earlier restore history") }
            old,err:=OpenVault(archive)
            if err!=nil { t.Fatal(err) }
            verifyForcedRestoreView(t,old,before)
          }

          func TestExplicitCleanStartRefusesLiveOwner(t *testing.T) {
            f:=newRollbackFixture(t)
            before:=workspaceFormatTree(t,filepath.Dir(f.root))
            if _,err:=StartCleanDevelopmentWorkspace(f.root);!errors.Is(err,ErrWorkspaceInUse) { t.Fatalf("live owner was not respected: %v",err) }
            if !reflect.DeepEqual(before,workspaceFormatTree(t,filepath.Dir(f.root))) { t.Fatal("refused reset changed existing state") }
          }

          func TestResetForcedStopRestart(t *testing.T) {
            for _,phase:=range []string{"reset_archived","reset_created"} {
              t.Run(phase,func(t *testing.T) {
                f:=newRollbackFixture(t)
                original:=f.active.Snapshot()
                if err:=f.active.Close();err!=nil { t.Fatal(err) }
                if err:=f.stage.Close();err!=nil { t.Fatal(err) }
                originalTree:=workspaceFormatTree(t,f.root)
                marker:=filepath.Join(t.TempDir(),"graceful-close.txt")
                killRestoreAtBoundary(t,phase,f.root,"",marker)
                parentBefore:=workspaceFormatTree(t,filepath.Dir(f.root))
                fresh,err:=OpenVault(f.root)
                if phase=="reset_archived" {
                  if fresh!=nil { _=fresh.Close() }
                  if !errors.Is(err,ErrWorkspaceRecoveryRequired) { t.Fatalf("interrupted reset silently continued: %v",err) }
                  if !reflect.DeepEqual(parentBefore,workspaceFormatTree(t,filepath.Dir(f.root))) { t.Fatal("reset recovery refusal changed retained state") }
                } else {
                  if err!=nil { t.Fatal(err) }
                  got:=fresh.Snapshot()
                  if len(got.Matters)!=0 || len(got.Evidence)!=0 || len(got.Questions)!=0 { _=fresh.Close();t.Fatal("completed fresh creation inherited old state") }
                  if err:=fresh.Save();err!=nil { _=fresh.Close();t.Fatal(err) }
                  if err:=fresh.Close();err!=nil { t.Fatal(err) }
                }
                entries,err:=os.ReadDir(filepath.Dir(f.root))
                if err!=nil { t.Fatal(err) }
                archive:=""
                for _,entry:=range entries {
                  if strings.HasPrefix(entry.Name(),filepath.Base(f.root)+".previous-") {
                    if archive!="" { t.Fatal("ambiguous test reset archive") }
                    archive=filepath.Join(filepath.Dir(f.root),entry.Name())
                  }
                }
                if archive=="" { t.Fatal("original reset archive missing") }
                if !reflect.DeepEqual(originalTree,workspaceFormatTree(t,archive)) { t.Fatal("forced reset changed original archived bytes") }
                old,err:=OpenVault(archive)
                if err!=nil { t.Fatal(err) }
                verifyForcedRestoreView(t,old,original)
              })
            }
          }

          func TestResetForcedStopChild(t *testing.T) {
            if os.Getenv("ECO_TEST_FORCED_RESTORE")!="1" { return }
            defer func(){ _=os.WriteFile(os.Getenv("ECO_TEST_RESTORE_CLOSED"),[]byte("graceful cleanup ran"),0600) }()
            boundary:=func(phase string) {
              if phase!=os.Getenv("ECO_TEST_RESTORE_PHASE") { return }
              if err:=json.NewEncoder(os.Stdout).Encode(struct{Phase string}{phase});err!=nil { t.Fatal(err) }
              var one [1]byte
              _,_=io.ReadFull(os.Stdin,one[:])
              t.Fatal("parent released reset boundary instead of killing child")
            }
            if _,err:=startCleanDevelopmentWorkspace(os.Getenv("ECO_TEST_RESTORE_ROOT"),boundary);err!=nil { t.Fatal(err) }
            t.Fatal("reset completed without reaching requested boundary")
          }
          '''))
          PY
          gofmt -w internal/eco/vault.go internal/eco/restore_restart.go internal/eco/development_workspace.go internal/eco/development_workspace_test.go internal/eco/restore_forced_stop_test.go internal/eco/explicit_clean_start.go internal/eco/explicit_clean_start_test.go cmd/eco/main_windows.go
          git diff --check
      - name: Qualify both operations and all existing tests
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_source_policy.py
          go test -count=1 -json -run '^(TestRestoreForcedStopRestart|TestRestoreRestartGuard|TestRestoreRestartPositiveControls|TestExplicitCleanStartWithRestoreHistory|TestExplicitCleanStartRefusesLiveOwner|TestResetForcedStopRestart)$' ./internal/eco | tee "$RUNNER_TEMP/clean-after.jsonl"
          go test -count=1 ./...
          go vet ./...
          GOOS=windows GOARCH=amd64 go test -c ./internal/eco -o "$RUNNER_TEMP/clean-start.test.exe"
          GOOS=windows GOARCH=amd64 go build -o "$RUNNER_TEMP/clean-start.exe" ./cmd/eco
          git diff --check
      - name: Record bounded qualification and commit reviewed source paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=[json.loads(s) for s in Path(os.environ['RUNNER_TEMP'],'clean-after.jsonl').read_text().splitlines()]
          assert not any(r.get('Action') in {'fail','skip'} for r in rows)
          leaves=sorted(r['Test'] for r in rows if r.get('Action')=='pass' and ('/' in r.get('Test','') or r.get('Test') in {'TestExplicitCleanStartWithRestoreHistory','TestExplicitCleanStartRefusesLiveOwner'}))
          assert len(leaves)==17,leaves
          receipt={'run_id':os.environ['GITHUB_RUN_ID'],'input_head':os.environ['GITHUB_SHA'],'before':'Intentional archive-then-open after prior restore reproduced as failing before the combined operation','after_passing_cases':leaves,'after_skips':0,'linux_full_tests':'passed','go_vet':'passed','source_policy':'passed','windows_cross_build':'passed','native_windows':'pending exact final PR CI','scope':'Seven actual forced-stop phases (five restore, two reset), not arbitrary interruption or power-loss proof','creation_permission':'Only the explicit operation may bypass missing-state refusal for its own newly created, exclusively owned, identity-checked directory; no permission persists after process exit','limits':['Interactive Windows/Acer recovery choice not yet exercised.','No automatic trusted recovery selection or cleanup based on filenames.','No durable crash journal or storage-controller failure proof.','W7 needs final acceptance mapping and failure-reporting review before closure; W8 remains actual-machine acceptance.']}
          Path('docs/control/EXPLICIT_CLEAN_START_QUALIFICATION_20260905.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
          branch='integration/restore-forced-stop-restart-20260905'
          git fetch origin "$branch"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/eco/vault.go internal/eco/restore_restart.go internal/eco/development_workspace.go internal/eco/development_workspace_test.go internal/eco/restore_forced_stop_test.go internal/eco/explicit_clean_start.go internal/eco/explicit_clean_start_test.go cmd/eco/main_windows.go docs/control/EXPLICIT_CLEAN_START_QUALIFICATION_20260905.json
          git commit -m 'Keep explicit clean start compatible while blocking silent reset restarts'
          git push origin "HEAD:refs/heads/$branch"
