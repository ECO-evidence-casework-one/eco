name: Qualify MBOX fuzz boundary

on:
  push:
    branches:
      - ops/mbox-fuzz-qualification-20260904
    paths:
      - .github/workflows/qualify-mbox-fuzz.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23.12'
          cache: false
      - name: Run bounded MBOX mutation fuzzing
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/eco -run='^$' -fuzz='^FuzzMBOXReader$' -fuzztime=30s -parallel=2
