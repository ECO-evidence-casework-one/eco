name: Build and test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eco-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check offline source and embedded-secret policy
        run: python3 scripts/check_source_policy.py

  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Unit and source-regression tests
        run: go test ./...
      - name: Go vet
        run: go vet ./...

  build-windows:
    needs: [source-policy, test-linux]
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Deterministic Windows build and tests
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Discard unsigned development build outputs
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath 'dist') {
            Remove-Item -LiteralPath 'dist' -Recurse -Force
          }

# Public GitHub Actions must not upload ECO executables, DLLs, installers,
# model/runtime payloads or runnable archives while the public-binary gate is
# closed. Controlled unsigned testing uses a separate private handoff with an
# exact hash, build identity, warning and withdrawal/expiry record.
