name: Build and test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eco-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check offline source and embedded-secret policy
        run: python3 scripts/check_source_policy.py

  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Unit and source-regression tests
        run: go test ./...
      - name: Go vet
        run: go vet ./...

  build-windows:
    needs: [source-policy, test-linux]
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Prove native-command failures stop the Windows gate
        shell: pwsh
        run: ./scripts/test-native-command-failure.ps1
      - name: Deterministic Windows build and tests
        shell: pwsh
        run: ./scripts/build-windows.ps1
      # P0 issues #24 and #27: the executable remains only on the ephemeral runner.
      # Public Actions artifact upload is disabled while binary release gates are closed.
