name: Build and test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - run: go vet ./...

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build and test
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Upload unsigned provenance artifact
        uses: actions/upload-artifact@v4
        with:
          name: eco-windows-unsigned-${{ github.sha }}
          path: dist/ECO.exe
          if-no-files-found: error
          retention-days: 14
