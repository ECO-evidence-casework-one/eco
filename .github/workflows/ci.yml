name: Build and test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eco-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check offline source and embedded-secret policy
        run: python3 scripts/check_source_policy.py

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install pinned Gitleaks v8.30.1
        shell: bash
        run: |
          set -euo pipefail
          version='8.30.1'
          archive="gitleaks_${version}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          target="$RUNNER_TEMP/$archive"
          curl --fail --location --silent --show-error "$url" --output "$target"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $target" | sha256sum --check --strict -
          tar -xzf "$target" -C "$RUNNER_TEMP" gitleaks
          chmod 0755 "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" version
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan checked-out repository for secrets
        shell: bash
        run: |
          set -euo pipefail
          gitleaks dir --redact --verbose --no-banner .

  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Unit and source-regression tests
        run: go test ./...
      - name: Go vet
        run: go vet ./...

  build-windows:
    needs: [source-policy, secret-scan, test-linux]
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Prove native-command failures stop the Windows gate
        shell: pwsh
        run: ./scripts/test-native-command-failure.ps1
      - name: Prove every Windows native stage stops later work
        shell: pwsh
        run: ./scripts/test-build-windows-failure-matrix.ps1
      - name: Deterministic Windows build and tests
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Install pinned Syft v1.51.1
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "syft_1.51.1_windows_amd64.zip"
          $url = "https://github.com/anchore/syft/releases/download/v1.51.1/syft_1.51.1_windows_amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "5e4bc3e6b6344b4625de0f7aa5351aaa72856d11d78462972de0a101ee2c1c8f"
          if ($actual -ne $expected) {
              throw "Syft v1.51.1 checksum mismatch: $actual"
          }
          $toolDir = Join-Path $env:RUNNER_TEMP "syft-v1.51.1"
          Remove-Item -LiteralPath $toolDir -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $archive -DestinationPath $toolDir
          $target = Join-Path $toolDir "syft.exe"
          if (-not (Test-Path -LiteralPath $target -PathType Leaf)) {
              throw "Syft archive did not contain syft.exe"
          }
          $env:SYFT_CHECK_FOR_APP_UPDATE = "false"
          & $target version
          if ($LASTEXITCODE -ne 0) {
              throw "Syft version self-check failed with native exit code $LASTEXITCODE"
          }
          "SYFT_EXE=$target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Generate and reconcile ECO SBOMs
        shell: pwsh
        run: ./scripts/test-syft-sbom.ps1 -SyftPath $env:SYFT_EXE
      - name: Install pinned Cosign v3.1.3
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $target = Join-Path $env:RUNNER_TEMP "cosign-v3.1.3.exe"
          $url = "https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-windows-amd64.exe"
          Invoke-WebRequest -Uri $url -OutFile $target
          $actual = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "9fe59be0eca1271873ce019061335eb1ac419b7059202e797828467ddabe33be"
          if ($actual -ne $expected) {
              throw "Cosign v3.1.3 checksum mismatch: $actual"
          }
          & $target version
          if ($LASTEXITCODE -ne 0) {
              throw "Cosign version self-check failed with native exit code $LASTEXITCODE"
          }
          "COSIGN_EXE=$target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prove private release-envelope signing and tamper rejection
        shell: pwsh
        run: ./scripts/test-cosign-release-envelope.ps1 -CosignPath $env:COSIGN_EXE
      # P0 issues #24 and #27: the executable remains only on the ephemeral runner.
      # Public Actions artifact upload is disabled while binary release gates are closed.
      # Syft inventories only the built artifact; external optional runtimes remain separately declared.
      # Cosign uses a throwaway CI-only key here: this proves plumbing, not publisher identity.
