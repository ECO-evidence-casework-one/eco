name: ECO recovery source repair

on:
  push:
    branches: [development/eco-recovery-candidate]
    paths:
      - 'recovery/repair-xaml-trigger.txt'

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: development/eco-recovery-candidate
          persist-credentials: true
          fetch-depth: 1

      - name: Apply exact Avalonia 12 syntax repairs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'recovery/Eco.Recovery/MainWindow.axaml'
          $text = [IO.File]::ReadAllText($path)

          $replacements = @(
            @('Watermark="Ask about this Matter or request a draft…"', 'PlaceholderText="Ask about this Matter or request a draft…"'),
            @('Checked="OnLowSensoryChanged" Unchecked="OnLowSensoryChanged"', 'Click="OnLowSensoryChanged"'),
            @('<Border Classes="Card"><TextBlock Text="£1,240" FontSize="28" FontWeight="Bold" /><TextBlock Classes="Muted" Text="Accepted quotation" /></Border>', '<Border Classes="Card"><StackPanel><TextBlock Text="£1,240" FontSize="28" FontWeight="Bold" /><TextBlock Classes="Muted" Text="Accepted quotation" /></StackPanel></Border>'),
            @('<Border Grid.Column="1" Classes="Card"><TextBlock Text="£620" FontSize="28" FontWeight="Bold" Foreground="{DynamicResource AccentBrush}" /><TextBlock Classes="Muted" Text="Received and evidenced" /></Border>', '<Border Grid.Column="1" Classes="Card"><StackPanel><TextBlock Text="£620" FontSize="28" FontWeight="Bold" Foreground="{DynamicResource AccentBrush}" /><TextBlock Classes="Muted" Text="Received and evidenced" /></StackPanel></Border>'),
            @('<Border Grid.Column="2" Classes="Card"><TextBlock Text="£620" FontSize="28" FontWeight="Bold" Foreground="{DynamicResource WarningBrush}" /><TextBlock Classes="Muted" Text="Conditional / not received" /></Border>', '<Border Grid.Column="2" Classes="Card"><StackPanel><TextBlock Text="£620" FontSize="28" FontWeight="Bold" Foreground="{DynamicResource WarningBrush}" /><TextBlock Classes="Muted" Text="Conditional / not received" /></StackPanel></Border>')
          )

          foreach ($pair in $replacements) {
            if (-not $text.Contains($pair[0])) {
              throw "Expected source pattern missing: $($pair[0])"
            }
            $text = $text.Replace($pair[0], $pair[1])
          }

          [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($false))
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Repaired source failed git diff check.' }
          git diff -- $path

      - name: Commit repaired source to recovery branch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'eco-recovery-bot'
          git config user.email 'eco-recovery-bot@users.noreply.github.com'
          git add recovery/Eco.Recovery/MainWindow.axaml
          git commit -m 'Recovery: correct Avalonia 12 XAML syntax'
          if ($LASTEXITCODE -ne 0) { throw 'Source repair commit failed.' }
          git push origin HEAD:development/eco-recovery-candidate
          if ($LASTEXITCODE -ne 0) { throw 'Source repair push failed.' }
