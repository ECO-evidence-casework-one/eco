name: ECO recovery source repair

on:
  push:
    branches: [development/eco-recovery-candidate]
    paths:
      - 'recovery/repair-xaml-trigger.txt'

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: development/eco-recovery-candidate
          persist-credentials: true
          fetch-depth: 1

      - name: Apply exact visual review repairs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $xamlPath = 'recovery/Eco.Recovery/MainWindow.axaml'
          $codePath = 'recovery/Eco.Recovery/MainWindow.axaml.cs'
          $xaml = [IO.File]::ReadAllText($xamlPath)
          $code = [IO.File]::ReadAllText($codePath)

          $oldStatus = '<Ellipse Width="9" Height="9" Fill="#47C98B" VerticalAlignment="Center" /><TextBlock x:Name="AIStatusText" Text="Offline engine ready" FontWeight="SemiBold" />'
          $newStatus = '<Ellipse Width="9" Height="9" Fill="#D97706" VerticalAlignment="Center" /><TextBlock x:Name="AIStatusText" Text="Integration pending" Foreground="{DynamicResource WarningBrush}" FontWeight="SemiBold" />'
          if (-not $xaml.Contains($oldStatus)) { throw 'Expected conversation AI status source was not found.' }
          $xaml = $xaml.Replace($oldStatus, $newStatus)

          $oldVisualSetup = "        SetPage(page, persist: false);`r`n    }`r`n`r`n    public void OpenStartForVisuals()"
          $newVisualSetup = "        SetPage(page, persist: false);`r`n        Toast.IsVisible = false;`r`n    }`r`n`r`n    public void OpenStartForVisuals()"
          if (-not $code.Contains($oldVisualSetup)) {
            $oldVisualSetup = "        SetPage(page, persist: false);`n    }`n`n    public void OpenStartForVisuals()"
            $newVisualSetup = "        SetPage(page, persist: false);`n        Toast.IsVisible = false;`n    }`n`n    public void OpenStartForVisuals()"
          }
          if (-not $code.Contains($oldVisualSetup)) { throw 'Expected visual setup source was not found.' }
          $code = $code.Replace($oldVisualSetup, $newVisualSetup)

          $oldLayout = "        var compact = Bounds.Width < 1050 || _state.InterfaceScale >= 1.9;`r`n        AppRoot.ColumnDefinitions[0].Width = new GridLength(compact ? 196 : 248);`r`n        BrandSubtitle.IsVisible = !compact;"
          $newLayout = "        var highScale = _state.InterfaceScale >= 1.9;`r`n        var compact = Bounds.Width < 1050 && !highScale;`r`n        AppRoot.ColumnDefinitions[0].Width = new GridLength(highScale ? 280 : compact ? 196 : 248);`r`n        BrandSubtitle.IsVisible = !compact;"
          if (-not $code.Contains($oldLayout)) {
            $oldLayout = "        var compact = Bounds.Width < 1050 || _state.InterfaceScale >= 1.9;`n        AppRoot.ColumnDefinitions[0].Width = new GridLength(compact ? 196 : 248);`n        BrandSubtitle.IsVisible = !compact;"
            $newLayout = "        var highScale = _state.InterfaceScale >= 1.9;`n        var compact = Bounds.Width < 1050 && !highScale;`n        AppRoot.ColumnDefinitions[0].Width = new GridLength(highScale ? 280 : compact ? 196 : 248);`n        BrandSubtitle.IsVisible = !compact;"
          }
          if (-not $code.Contains($oldLayout)) { throw 'Expected responsive layout source was not found.' }
          $code = $code.Replace($oldLayout, $newLayout)

          [IO.File]::WriteAllText($xamlPath, $xaml, [Text.UTF8Encoding]::new($false))
          [IO.File]::WriteAllText($codePath, $code, [Text.UTF8Encoding]::new($false))
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Visual repair source failed git diff check.' }
          git diff -- $xamlPath $codePath

      - name: Commit repaired source to recovery branch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'eco-recovery-bot'
          git config user.email 'eco-recovery-bot@users.noreply.github.com'
          git add recovery/Eco.Recovery/MainWindow.axaml recovery/Eco.Recovery/MainWindow.axaml.cs
          git commit -m 'Recovery: correct visual truth and high-scale layout'
          if ($LASTEXITCODE -ne 0) { throw 'Visual repair commit failed.' }
          git push origin HEAD:development/eco-recovery-candidate
          if ($LASTEXITCODE -ne 0) { throw 'Visual repair push failed.' }
