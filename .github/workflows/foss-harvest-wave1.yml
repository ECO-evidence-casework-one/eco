name: FOSS donor harvest wave 1

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/foss-harvest-wave1.yml'
      - 'scripts/foss/acquire-donors.ps1'
      - 'docs/foss/WAVE1_DONOR_REGISTER.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harvest:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Acquire all Wave 1 FOSS donor source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'ECO_FOSS_DONORS'
          ./scripts/foss/acquire-donors.ps1 -Root $root -IncludeLarge

          $summaryFile = Get-ChildItem -LiteralPath (Join-Path $root 'REPORTS') -Filter 'summary_*.json' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $summaryFile) { throw 'Donor acquisition did not create a summary.' }
          $summary = Get-Content -LiteralPath $summaryFile.FullName -Raw | ConvertFrom-Json
          if ([int]$summary.failed -ne 0) { throw "Donor acquisition reported $($summary.failed) failure(s)." }
          if ([int]$summary.acquired -ne 15) { throw "Expected 15 acquired Wave 1 donors, got $($summary.acquired)." }
          if ([int]$summary.skipped_large -ne 0) { throw 'IncludeLarge harvest unexpectedly skipped a donor.' }

      - name: Create exact-commit source archives and audit bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'ECO_FOSS_DONORS'
          $bundle = Join-Path $env:RUNNER_TEMP 'ECO_FOSS_WAVE1_BUNDLE'
          $sources = Join-Path $bundle 'SOURCES'
          $control = Join-Path $bundle 'CONTROL'
          New-Item -ItemType Directory -Force -Path $sources,$control | Out-Null

          $inventoryFile = Get-ChildItem -LiteralPath (Join-Path $root 'REPORTS') -Filter 'donor_inventory_*.json' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $inventoryFile) { throw 'Acquisition inventory is missing.' }
          $inventory = @(Get-Content -LiteralPath $inventoryFile.FullName -Raw | ConvertFrom-Json)
          $acquired = @($inventory | Where-Object status -eq 'ACQUIRED')
          if ($acquired.Count -ne 15) { throw "Expected 15 acquired inventory rows, got $($acquired.Count)." }

          $archiveRows = @()
          foreach ($item in ($acquired | Sort-Object name)) {
            $name = [string]$item.name
            $dirPath = [string]$item.path
            $commit = [string]$item.commit
            if ($commit -notmatch '^[0-9a-f]{40}$') { throw "Inventory commit is invalid for $name." }
            if (-not (Test-Path -LiteralPath (Join-Path $dirPath '.git') -PathType Container)) {
              throw "Acquired checkout is missing for $name."
            }
            $safeName = ($name -replace '[^A-Za-z0-9._-]','_')
            $archiveName = "$safeName-$($commit.Substring(0,12)).tar.gz"
            $archivePath = Join-Path $sources $archiveName
            & git -C $dirPath archive --format=tar.gz "--output=$archivePath" $commit
            if ($LASTEXITCODE -ne 0) { throw "git archive failed for $name at $commit." }
            $archiveHash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
            $archiveRows += [pscustomobject]@{
              name = $name
              repo = [string]$item.repo
              expected_license = [string]$item.expected_license
              commit = $commit
              archive = "SOURCES/$archiveName"
              archive_sha256 = $archiveHash
              bytes = (Get-Item -LiteralPath $archivePath).Length
            }
          }
          if ($archiveRows.Count -ne 15) { throw "Expected 15 source archives, got $($archiveRows.Count)." }

          Copy-Item -LiteralPath (Join-Path $root 'LICENSE_SNAPSHOTS') -Destination $bundle -Recurse
          Copy-Item -LiteralPath (Join-Path $root 'REPORTS') -Destination $bundle -Recurse
          Copy-Item -LiteralPath 'docs/foss/WAVE1_DONOR_REGISTER.md' -Destination $control
          Copy-Item -LiteralPath 'scripts/foss/acquire-donors.ps1' -Destination $control

          $archiveRows | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $bundle 'SOURCE_ARCHIVES.json') -Encoding utf8
          $archiveRows | Export-Csv -LiteralPath (Join-Path $bundle 'SOURCE_ARCHIVES.csv') -NoTypeInformation -Encoding utf8
          $hashLines = foreach ($row in $archiveRows) { "$($row.archive_sha256)  $($row.archive)" }
          $hashLines | Set-Content -LiteralPath (Join-Path $bundle 'SHA256SUMS.txt') -Encoding ascii

          $inventoryHash = (Get-FileHash -LiteralPath $inventoryFile.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $complete = [ordered]@{
            schema = 1
            generated_utc = (Get-Date).ToUniversalTime().ToString('o')
            source = 'GitHub public repositories listed in ECO Wave 1 donor register'
            donors_expected = 15
            donors_archived = $archiveRows.Count
            paddleocr_included = $true
            exact_commit_archives = $true
            acquisition_inventory_sha256 = $inventoryHash
            artifact_contains_git_directories = $false
            note = 'Each source tarball was produced with git archive from the exact commit already recorded by the successful acquisition step. Licence snapshots and acquisition reports are included.'
          }
          $complete | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $bundle 'HARVEST_COMPLETE.json') -Encoding utf8

          "FOSS_BUNDLE_PATH=$bundle" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload one complete Wave 1 FOSS source bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ECO-FOSS-DONORS-WAVE1-20260904
          path: ${{ env.FOSS_BUNDLE_PATH }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          compression-level: 6
