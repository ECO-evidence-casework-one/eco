name: Diagnose workspace Vault surface

on:
  push:
    paths:
      - '.github/workflows/diag-workspace-vault-surface.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Inventory Vault methods and opens
        shell: bash
        run: |
          set -euo pipefail
          echo '=== VAULT METHODS ==='
          grep -R -n -E '^func \(v \*Vault\)' internal/eco --include='*.go' | sort || true
          echo '=== OPENVAULT CALLS ==='
          grep -R -n -F 'OpenVault(' cmd internal --include='*.go' | sort || true
