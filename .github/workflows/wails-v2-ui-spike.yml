name: Wails v2 UI architecture spike

on:
  pull_request:
    paths:
      - 'spikes/wails-v2-ui/**'
      - 'internal/app/**'
      - '.github/workflows/wails-v2-ui-spike.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25.0'
          cache: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.4.0
        with:
          node-version: '22'
      - name: Build React TypeScript frontend
        shell: pwsh
        working-directory: spikes/wails-v2-ui/frontend
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Resolve and build isolated Wails v2.14 spike
        shell: pwsh
        working-directory: spikes/wails-v2-ui
        env:
          GOTOOLCHAIN: local
        run: |
          go mod tidy
          go mod verify
          go build -trimpath -o eco-ui-spike.exe .
          if (-not (Test-Path ./eco-ui-spike.exe)) { throw 'Wails spike binary was not produced' }
      - name: Restore ECO production Go toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.23.12'
          cache: false
      - name: Re-run ECO service contract tests on production Go line
        shell: pwsh
        env:
          GOTOOLCHAIN: local
        run: go test ./internal/app
      - name: Prepare Windows acceptance package
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'eco-wails-v2-windows-acceptance'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item 'spikes/wails-v2-ui/eco-ui-spike.exe' $out
          Copy-Item 'spikes/wails-v2-ui/WINDOWS_ACCEPTANCE.md' $out
          Copy-Item 'spikes/wails-v2-ui/WINDOWS_ACCEPTANCE_RECEIPT_TEMPLATE.json' $out
          Copy-Item 'spikes/wails-v2-ui/ACCEPTANCE_RUNBOOK.md' $out
          $hash = (Get-FileHash (Join-Path $out 'eco-ui-spike.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *eco-ui-spike.exe" | Set-Content -Encoding ascii (Join-Path $out 'eco-ui-spike.sha256.txt')
          @(
            "ECO Wails v2 Windows acceptance package"
            "Commit: $env:GITHUB_SHA"
            "Run ID: $env:GITHUB_RUN_ID"
            "Wails: v2.14.0"
            "Spike Go: 1.25.0"
            "ECO production Go acceptance: 1.23.12"
            "Synthetic test data only. This is not a production ECO build."
          ) | Set-Content -Encoding utf8 (Join-Path $out 'BUILD_INFO.txt')
      - name: Upload Windows acceptance package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eco-wails-v2-windows-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/eco-wails-v2-windows-acceptance
          if-no-files-found: error
          retention-days: 14
