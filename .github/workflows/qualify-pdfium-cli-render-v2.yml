name: Repair pdfium-cli benchmark receipt

on:
  push:
    branches:
      - ops/pdfium-cli-render-qualification-20260904
    paths:
      - .github/workflows/qualify-pdfium-cli-render-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ops/pdfium-cli-render-qualification-20260904
          fetch-depth: 0

      - name: Re-run exact render qualification and write clean metrics
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://github.com/klippa-app/pdfium-cli/releases/download/v0.11.2/pdfium-webassembly-windows-amd64' -OutFile pdfium.exe
          $asset = Get-Item pdfium.exe
          if ($asset.Length -ne 16988160) { throw "Unexpected asset size $($asset.Length)" }
          $hash = (Get-FileHash pdfium.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'b56c3c405111ae68cc99b225f8627ea25ec5a7cb3188bdfca67b4cac5df2189f') { throw "SHA-256 mismatch $hash" }

          @'
          from pathlib import Path
          objects = [
              b'<< /Type /Catalog /Pages 2 0 R >>',
              b'<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
              b'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 5 0 R >> >> /Contents 4 0 R >>',
              b'<< /Length 57 >>\nstream\nBT /F1 24 Tf 72 720 Td (ECO PDF RENDER 123) Tj ET\nendstream',
              b'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>',
          ]
          out = bytearray(b'%PDF-1.4\n%\xe2\xe3\xcf\xd3\n')
          offsets = [0]
          for i, obj in enumerate(objects, 1):
              offsets.append(len(out)); out += f'{i} 0 obj\n'.encode()+obj+b'\nendobj\n'
          xref=len(out); out += f'xref\n0 {len(objects)+1}\n'.encode()+b'0000000000 65535 f \n'
          for off in offsets[1:]: out += f'{off:010d} 00000 n \n'.encode()
          out += f'trailer\n<< /Size {len(objects)+1} /Root 1 0 R >>\nstartxref\n{xref}\n%%EOF\n'.encode()
          Path('known.pdf').write_bytes(out)
          Path('malformed.pdf').write_bytes(b'%PDF-1.7\n1 0 obj\n<< /Type /Catalog >>\n')
          '@ | python -

          function Invoke-Render([string]$output) {
            $psi = [System.Diagnostics.ProcessStartInfo]::new()
            $psi.FileName = (Resolve-Path '.\pdfium.exe')
            $psi.ArgumentList.Add('render')
            $psi.ArgumentList.Add('--pages'); $psi.ArgumentList.Add('1')
            $psi.ArgumentList.Add('--file-type'); $psi.ArgumentList.Add('png')
            $psi.ArgumentList.Add('--max-width'); $psi.ArgumentList.Add('1200')
            $psi.ArgumentList.Add((Resolve-Path '.\known.pdf').Path)
            $psi.ArgumentList.Add((Join-Path (Get-Location) $output))
            $psi.UseShellExecute = $false; $psi.RedirectStandardOutput = $true; $psi.RedirectStandardError = $true; $psi.CreateNoWindow = $true
            $p = [System.Diagnostics.Process]::new(); $p.StartInfo = $psi
            $sw = [System.Diagnostics.Stopwatch]::StartNew(); [void]$p.Start()
            if (-not $p.WaitForExit(60000)) { try { $p.Kill($true) } catch {}; throw 'Render exceeded 60-second bound' }
            $sw.Stop(); $stdout=$p.StandardOutput.ReadToEnd(); $stderr=$p.StandardError.ReadToEnd()
            if ($p.ExitCode -ne 0) { throw "Render failed: $stderr $stdout" }
            if (!(Test-Path $output)) { throw "Missing output $output" }
            [pscustomobject]@{ milliseconds=$sw.ElapsedMilliseconds; peak_bytes=$p.PeakWorkingSet64; output_bytes=(Get-Item $output).Length }
          }

          $runs = @((Invoke-Render 'render-a.png'), (Invoke-Render 'render-b.png'), (Invoke-Render 'render-c.png'))
          @'
          from pathlib import Path
          import struct
          for name in ['render-a.png','render-b.png','render-c.png']:
              data=Path(name).read_bytes()
              if not data.startswith(b'\x89PNG\r\n\x1a\n'): raise SystemExit('invalid PNG')
              w,h=struct.unpack('>II',data[16:24])
              if not (500 <= w <= 1200 and 500 <= h <= 2000): raise SystemExit(f'bad dimensions {w}x{h}')
          '@ | python -

          $badPsi = [System.Diagnostics.ProcessStartInfo]::new(); $badPsi.FileName=(Resolve-Path '.\pdfium.exe')
          foreach ($arg in @('render','--pages','1','--file-type','png','--max-width','1200',(Resolve-Path '.\malformed.pdf').Path,(Join-Path (Get-Location) 'bad.png'))) { $badPsi.ArgumentList.Add($arg) }
          $badPsi.UseShellExecute=$false; $badPsi.RedirectStandardOutput=$true; $badPsi.RedirectStandardError=$true; $badPsi.CreateNoWindow=$true
          $bad=[System.Diagnostics.Process]::new(); $bad.StartInfo=$badPsi; [void]$bad.Start()
          if (-not $bad.WaitForExit(15000)) { try { $bad.Kill($true) } catch {}; throw 'Malformed input exceeded 15-second bound' }
          if ($bad.ExitCode -eq 0) { throw 'Malformed input unexpectedly succeeded' }

          $avgMs=[math]::Round((($runs|Measure-Object milliseconds -Average).Average),2)
          $maxMs=($runs|Measure-Object milliseconds -Maximum).Maximum
          $maxPeak=($runs|Measure-Object peak_bytes -Maximum).Maximum
          $peakMiB=[math]::Round($maxPeak/1MB,2)
          $maxOutput=($runs|Measure-Object output_bytes -Maximum).Maximum
          Write-Host "PDFIUM_METRICS avg_ms=$avgMs max_ms=$maxMs peak_mib=$peakMiB max_png_bytes=$maxOutput"
          $runs | ConvertTo-Json -Depth 3 | Set-Content -Encoding utf8 pdfium-run-metrics.json

          $lines = @(
            '# pdfium-cli Windows WebAssembly render qualification',
            '',
            'Date: 2026-09-04',
            '',
            'Status: PASS — GitHub-hosted Windows runner qualification only. This is not low-spec Acer evidence and does not approve integration or release.',
            '',
            '- Upstream: klippa-app/pdfium-cli',
            '- Licence: MIT; upstream states embedded Wazero and PDFium are Apache-2.0.',
            '- Release: v0.11.2',
            '- Exact source tag commit: 260c846dbbd180fdc478a2771e9dae9914164846',
            '- Asset: pdfium-webassembly-windows-amd64',
            '- Asset bytes: 16988160',
            '- Asset SHA-256: b56c3c405111ae68cc99b225f8627ea25ec5a7cb3188bdfca67b4cac5df2189f',
            '- Packaging: single Windows PE; no separately installed PDFium runtime required for the WebAssembly release type.',
            '- Known one-page PDF: rendered to PNG successfully three times at max width 1200 px.',
            ('- Mean render process time on GitHub runner: {0} ms' -f $avgMs),
            ('- Slowest of three runs: {0} ms' -f $maxMs),
            ('- Maximum observed process peak working set: {0} MiB' -f $peakMiB),
            ('- Maximum rendered PNG bytes: {0}' -f $maxOutput),
            '- Malformed PDF: non-zero exit within 15 seconds; no output retained.',
            '- No ECO executable or pdfium-cli binary was uploaded as an Actions artifact.',
            '',
            'Decision boundary: suitable for further ECO adapter qualification as an isolated, hash-pinned renderer. Low-spec Windows evidence remains required before adoption.'
          )
          New-Item -ItemType Directory -Force docs\foss\qualification | Out-Null
          $lines | Set-Content -Encoding utf8 docs\foss\qualification\PDFIUM_CLI_RENDER_QUALIFICATION_20260904.md

      - name: Commit corrected text-only receipt
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'ECO GitHub qualification bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/foss/qualification/PDFIUM_CLI_RENDER_QUALIFICATION_20260904.md
          git diff --cached --check
          if (git diff --cached --quiet) { throw 'Corrected receipt produced no change' }
          git commit -m 'Correct pdfium-cli render qualification receipt'
          git push origin HEAD:ops/pdfium-cli-render-qualification-20260904
