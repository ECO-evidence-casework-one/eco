name: Apply PDFium multi-page navigation slice

on:
  push:
    branches:
      - integration/pdfium-page-navigation-20260905
    paths:
      - .github/workflows/apply-pdfium-page-navigation.yml
      - scripts/apply_pdfium_page_navigation.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: integration/pdfium-page-navigation-20260905
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23.12'
          cache: false
      - name: Apply and qualify navigation source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_pdfium_page_navigation.py
          gofmt -w internal/eco/pdfium_renderer.go internal/eco/pdfium_renderer_test.go cmd/eco/main_windows.go cmd/eco/winapi_windows.go
          go test ./...
          go vet ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/eco-pdf-navigation.exe ./cmd/eco
          python3 scripts/check_source_policy.py
          git diff --check
          git config user.name 'ECO GitHub integration bot'
          git config user.email 'actions@users.noreply.github.com'
          git add internal/eco/pdfium_renderer.go internal/eco/pdfium_renderer_test.go cmd/eco/main_windows.go cmd/eco/winapi_windows.go docs/foss/PDFIUM_PAGE_NAVIGATION_INTEGRATION.md
          git commit -m 'Add bounded multi-page PDF preview navigation'
          git push origin HEAD:integration/pdfium-page-navigation-20260905
