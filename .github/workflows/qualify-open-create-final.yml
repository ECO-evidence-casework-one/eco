name: Qualify corrected strict-open integration
on:
  push:
    branches: [integration/restore-forced-stop-restart-20260905]
    paths: [.github/workflows/qualify-open-create-final.yml]
permissions:
  contents: write
jobs:
  qualify:
    if: github.ref == 'refs/heads/integration/restore-forced-stop-restart-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: false
      - name: Run pinned strict-open qualifier with exact positive-control anchors
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .github/workflows/qualify-explicit-open-create.yml)" = 'eaa1efe2ba4cbfc1acd293cabd5656559b67817a'
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,textwrap
          lines=Path('.github/workflows/qualify-explicit-open-create.yml').read_text().splitlines()
          scripts=[];i=0
          while i<len(lines):
              if lines[i]=='        run: |':
                  i+=1;block=[]
                  while i<len(lines) and (lines[i].startswith('          ') or not lines[i].strip()):
                      block.append(lines[i][10:] if lines[i].startswith('          ') else '');i+=1
                  scripts.append('\n'.join(block)+'\n')
              else:i+=1
          assert len(scripts)==4
          a=scripts[1].index("p=Path('internal/eco/restore_restart_test.go')")
          b=scripts[1].index('# Print every production caller',a)
          replacement=textwrap.dedent(r'''
          p=Path('internal/eco/restore_restart_test.go');s=p.read_text()
          cut=s.index('func TestRestoreRestartPositiveControls')
          unchanged,s=s[:cut],s[cut:]
          s=once(s,'\n\t\t\t\tv, err := OpenVault(root)','\n\t\t\t\tv, err := CreateVault(root)')
          s=once(s,'\n\t\t\tv, err := OpenVault(root)','\n\t\t\tvar v *Vault\n\t\t\tvar err error\n\t\t\tif name == "healthy_existing" { v, err = OpenVault(root) } else { v, err = CreateVault(root) }')
          p.write_text(unchanged+s)
          ''').lstrip('\n')
          scripts[1]=scripts[1][:a]+replacement+scripts[1][b:]
          scripts[3]=scripts[3].replace("receipt={'run_id':", "receipt={'earlier_qualifier_failure':'33976809090 reproduced both red contract cases then stopped at a non-unique source anchor; no generated product commit. Anchors now scoped to the positive-control function and whole lines.','run_id':",1)
          for n,script in enumerate(scripts,1):
              print(f'::group::Strict-open qualification stage {n}',flush=True)
              subprocess.run(['bash','-euo','pipefail','-c',script],check=True)
              print('::endgroup::',flush=True)
          PY
