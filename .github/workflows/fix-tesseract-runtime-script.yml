name: Repair Tesseract runtime integration script

on:
  push:
    branches:
      - integration/tesseract-runtime-bundle-20260904
    paths:
      - .github/workflows/fix-tesseract-runtime-script.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: integration/tesseract-runtime-bundle-20260904
          fetch-depth: 0
      - name: Rename Tesseract-specific directory helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_tesseract_runtime_bundle.py')
          s = p.read_text(encoding='utf-8')
          old = 'requireAbsoluteDirectory'
          new = 'requireAbsoluteTesseractDirectory'
          if old not in s:
              raise SystemExit('expected helper name not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          git config user.name 'ECO GitHub integration bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/apply_tesseract_runtime_bundle.py
          git commit -m 'Fix Tesseract runtime helper collision'
          git push origin HEAD:integration/tesseract-runtime-bundle-20260904
