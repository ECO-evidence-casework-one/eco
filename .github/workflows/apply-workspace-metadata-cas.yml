name: Apply workspace metadata CAS

on:
  push:
    branches: [ integration/workspace-metadata-cas-current-main-20260905 ]
    paths:
      - scripts/ops/apply_workspace_metadata_cas.py
      - .github/workflows/apply-workspace-metadata-cas.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: false
      - name: Apply and qualify CAS slice
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ops/apply_workspace_metadata_cas.py
          gofmt -w internal/eco/types.go internal/eco/vault.go internal/eco/backup.go internal/eco/workspace_cas_test.go
          python3 scripts/check_source_policy.py
          go test ./...
          go vet ./...
          GOOS=windows GOARCH=amd64 go test -c ./internal/eco -o "$RUNNER_TEMP/eco-internal.test.exe"
          GOOS=windows GOARCH=amd64 go build ./cmd/eco
          git diff --check
      - name: Commit qualified product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "eco-ci-bot"
          git config user.email "eco-ci-bot@users.noreply.github.com"
          git add internal/eco/types.go internal/eco/vault.go internal/eco/backup.go internal/eco/workspace_cas_test.go docs/control/WORKSPACE_METADATA_CAS_20260905.md
          git commit -m "Add authenticated workspace metadata CAS"
          git push origin HEAD:integration/workspace-metadata-cas-current-main-20260905
