name: ECO recovery M1.18 source export

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/eco-recovery-m118-source-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify and archive isolated M1.18 source
        shell: bash
        run: |
          set -euo pipefail
          test -d internal/runtime/turnorchestrator
          mkdir -p recovery-m118
          cp -a internal/runtime/turnorchestrator recovery-m118/
          find recovery-m118 -type f -print0 | sort -z | xargs -0 sha256sum > recovery-m118/SHA256SUMS.txt
          tar -czf recovery-m118-source.tar.gz recovery-m118
          sha256sum recovery-m118-source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ECO_M118_ISOLATED_SOURCE_EXPORT
          path: recovery-m118-source.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
