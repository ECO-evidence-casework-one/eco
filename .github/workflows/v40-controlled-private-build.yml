name: V40 controlled private Windows build

on:
  push:
    branches:
      - development/v40-integrated-synthetic-ai-candidate
    paths:
      - '.github/workflows/v40-controlled-private-build.yml'
      - 'build-input/v40/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/v40-controlled-private-build.yml'
      - 'build-input/v40/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v40-controlled-private-windows-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify private synthetic candidate
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - name: Checkout exact tested ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Go 1.23
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23.x'
          check-latest: false
          cache: false

      - name: Reconstruct controlled private build script
        shell: pwsh
        run: |
          $b = New-Object System.Text.StringBuilder
          $parts = @(
            "build-input/v40/private-build.part00",
            "build-input/v40/private-build.part01",
            "build-input/v40/private-build.part020",
            "build-input/v40/private-build.part021",
            "build-input/v40/private-build.part022",
            "build-input/v40/private-build.part03"
          )
          foreach ($p in $parts) {
            [void]$b.Append((Get-Content -Raw $p).Trim())
          }
          $scriptPath = "build-input/v40/private-build.ps1"
          [IO.File]::WriteAllBytes(
            $scriptPath,
            [Convert]::FromBase64String($b.ToString())
          )
          $stagedHash = (Get-FileHash -Algorithm SHA256 $scriptPath).Hash.ToLowerInvariant()
          if ($stagedHash -ne "6f04845f501d3d312220dc55f626d04a2a7cd2b10faa20474c5f2f82ee8df0d6") {
            throw "Staged private build script hash mismatch: $stagedHash"
          }
          $text = Get-Content -Raw $scriptPath
          $text = $text.Replace(
            "7f4909b066a3be91bb3308af3bd81c0c64fe14943ab91194a025516ea4ad9195",
            "7f4909d8720bc6839ba921e762b81676bc445c18f6b825a29117b9ce7d8b2011"
          )
          [IO.File]::WriteAllText($scriptPath, $text, [Text.UTF8Encoding]::new($false))
          $finalHash = (Get-FileHash -Algorithm SHA256 $scriptPath).Hash.ToLowerInvariant()
          if ($finalHash -ne "672f4432ff66aa0a1ebd0edc33a3ed9571dcbb4baa477b4ee1136ad2f30f00a6") {
            throw "Corrected private build script hash mismatch: $finalHash"
          }

      - name: Build genuine offline synthetic candidate
        shell: pwsh
        run: ./build-input/v40/private-build.ps1

      - name: Upload private controlled handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ECO_V40_SYNTHETIC_AI_PRIVATE_HANDOFF
          path: v40-private-build/handoff
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false
