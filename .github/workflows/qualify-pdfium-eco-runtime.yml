name: Qualify actual PDFium runtime through ECO vault

on:
  push:
    branches:
      - ops/pdfium-eco-runtime-qualification-20260904
    paths:
      - .github/workflows/qualify-pdfium-eco-runtime.yml
      - internal/eco/pdfium_actual_runtime_qualification_test.go
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ops/pdfium-eco-runtime-qualification-20260904
          fetch-depth: 1
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23.12'
          cache: false
      - name: Download and independently verify exact qualified renderer
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest -Uri 'https://github.com/klippa-app/pdfium-cli/releases/download/v0.11.2/pdfium-webassembly-windows-amd64' -OutFile pdfium-qualified.exe
          $info=Get-Item pdfium-qualified.exe
          if($info.Length -ne 16988160){throw "Unexpected renderer size $($info.Length)"}
          $hash=(Get-FileHash pdfium-qualified.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -ne 'b56c3c405111ae68cc99b225f8627ea25ec5a7cb3188bdfca67b4cac5df2189f'){throw "Unexpected renderer SHA-256 $hash"}
      - name: Exercise exact runtime through ECO preservation and render workflow
        shell: pwsh
        env:
          ECO_PDFIUM_CLI: ${{ github.workspace }}\pdfium-qualified.exe
        run: |
          $ErrorActionPreference='Stop'
          go test ./internal/eco -run '^TestActualQualifiedPDFiumRuntimeThroughVault$' -count=1 -v
          if($LASTEXITCODE -ne 0){throw "Actual ECO/pdfium runtime qualification failed with exit code $LASTEXITCODE"}
      - name: Prove no executable was retained as repository output
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if(Test-Path pdfium-qualified.exe){Remove-Item -Force pdfium-qualified.exe}
          if(Test-Path pdfium-qualified.exe){throw 'Renderer cleanup failed'}
          git status --short
