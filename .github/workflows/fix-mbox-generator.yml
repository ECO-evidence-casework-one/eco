name: Repair MBOX integration generator

on:
  push:
    branches:
      - integration/mbox-reader-20260904
    paths:
      - .github/workflows/fix-mbox-generator.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: integration/mbox-reader-20260904
          fetch-depth: 0
      - name: Remove unnecessary errors dependency from generated code
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_mbox_reader.py')
          s = p.read_text(encoding='utf-8')
          old = 'return "", errors.New("mailbox contains no readable mbox messages")'
          new = 'return "", fmt.Errorf("mailbox contains no readable mbox messages")'
          if old not in s:
              raise SystemExit('expected generated errors.New call not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git config user.name 'ECO GitHub integration bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/apply_mbox_reader.py
          git commit -m 'Fix MBOX generated error construction'
          git push origin HEAD:integration/mbox-reader-20260904
