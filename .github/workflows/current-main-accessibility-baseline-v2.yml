name: Measure current native accessibility baseline v2
on:
  push:
    paths:
      - .github/workflows/current-main-accessibility-baseline-v2.yml
permissions:
  contents: write
jobs:
  baseline:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build current ECO
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          go test ./cmd/eco
          go build -trimpath -ldflags '-H windowsgui' -o "$env:RUNNER_TEMP\ECO-a11y-baseline.exe" ./cmd/eco
      - name: Inspect with proven Windows accessibility interop
        shell: powershell
        run: .\scripts\ops\probe_current_accessibility.ps1 -ExePath "$env:RUNNER_TEMP\ECO-a11y-baseline.exe" -TempRoot "$env:RUNNER_TEMP\eco-a11y-probe"
      - name: Commit text-only baseline receipt
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'ECO Accessibility Probe'
          git config user.email 'eco-accessibility-probe@users.noreply.github.com'
          git add docs/testing/CURRENT_MAIN_ACCESSIBILITY_BASELINE_20260905.md
          git commit -m 'Record current-main accessibility baseline'
          git push origin HEAD:ops/current-main-accessibility-baseline-20260905
