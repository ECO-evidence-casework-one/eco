name: FOSS donor harvest wave 2

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/foss-harvest-wave2.yml'
      - 'docs/foss/WAVE2_DONOR_REGISTER.md'

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Acquire and archive exact Wave 2 commits
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ECO_FOSS_WAVE2"
          mkdir -p "$root/SOURCES" "$root/LICENSE_SNAPSHOTS" "$root/REPORTS" "$root/CONTROL" "$RUNNER_TEMP/checkouts"

          cat > "$RUNNER_TEMP/donors.tsv" <<'EOF'
          syft	anchore/syft	Apache-2.0	build-release-sbom
          go-fuzz	dvyukov/go-fuzz	Apache-2.0	go-fuzz-patterns
          oss-fuzz	google/oss-fuzz	Apache-2.0	fuzz-harness-corpus-patterns
          sqlite	sqlite/sqlite	Public-Domain	corruption-fault-injection-patterns
          go-message	emersion/go-message	MIT	email-mime-parser-candidate
          go-mbox	emersion/go-mbox	MIT	mbox-parser-candidate
          archives	mholt/archives	MIT	archive-parser-candidate
          AFLplusplus	AFLplusplus/AFLplusplus	AGPL-3.0	external-dev-fuzzer-only
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p=Path(__import__('os').environ['RUNNER_TEMP'])/'donors.tsv'
          p.write_text('\n'.join(line.strip() for line in p.read_text().splitlines() if line.strip())+'\n')
          PY

          printf 'name\trepo\tlicence\trole\tcommit\tbranch\tarchive\tarchive_sha256\tbytes\tlicense_files\n' > "$root/REPORTS/inventory.tsv"

          while IFS=$'\t' read -r name repo licence role; do
            checkout="$RUNNER_TEMP/checkouts/$name"
            echo "=== $name ($repo) ==="
            git clone --depth 1 --no-tags "https://github.com/$repo.git" "$checkout"
            commit=$(git -C "$checkout" rev-parse HEAD)
            branch=$(git -C "$checkout" branch --show-current)
            test "${#commit}" -eq 40

            snap="$root/LICENSE_SNAPSHOTS/$name"
            mkdir -p "$snap"
            license_files=''
            while IFS= read -r lf; do
              cp "$lf" "$snap/$(basename "$lf")"
              if [ -z "$license_files" ]; then license_files=$(basename "$lf"); else license_files="$license_files;$(basename "$lf")"; fi
            done < <(find "$checkout" -maxdepth 1 -type f \( -iname 'LICENSE*' -o -iname 'LICENCE*' -o -iname 'COPYING*' -o -iname 'NOTICE*' \) | sort)
            test -n "$license_files"

            case "$licence" in
              Apache-2.0) grep -Rqi 'Apache License' "$snap" ;;
              MIT) grep -Rqi 'MIT License' "$snap" ;;
              Public-Domain) grep -Rqi 'Public Domain' "$snap" ;;
              AGPL-3.0) grep -Rqi 'GNU AFFERO GENERAL PUBLIC LICENSE' "$snap" ;;
              *) echo "unsupported expected licence $licence" >&2; exit 1 ;;
            esac

            safe=$(printf '%s' "$name" | tr -c 'A-Za-z0-9._-' '_')
            archive="$root/SOURCES/${safe}-${commit:0:12}.tar.gz"
            git -C "$checkout" archive --format=tar.gz --output="$archive" "$commit"
            ahash=$(sha256sum "$archive" | awk '{print $1}')
            bytes=$(stat -c '%s' "$archive")
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$name" "$repo" "$licence" "$role" "$commit" "$branch" "SOURCES/$(basename "$archive")" "$ahash" "$bytes" "$license_files" >> "$root/REPORTS/inventory.tsv"
          done < "$RUNNER_TEMP/donors.tsv"

          cp docs/foss/WAVE2_DONOR_REGISTER.md "$root/CONTROL/"
          python3 - "$root" <<'PY'
          import csv, hashlib, json, pathlib, sys
          root=pathlib.Path(sys.argv[1])
          rows=[]
          with (root/'REPORTS'/'inventory.tsv').open(newline='', encoding='utf-8') as f:
              for r in csv.DictReader(f, delimiter='\t'):
                  r['bytes']=int(r['bytes'])
                  rows.append(r)
          if len(rows)!=8:
              raise SystemExit(f'expected 8 donors, got {len(rows)}')
          (root/'REPORTS'/'inventory.json').write_text(json.dumps(rows, indent=2)+'\n', encoding='utf-8')
          with (root/'SHA256SUMS.txt').open('w', encoding='ascii') as f:
              for r in rows:
                  f.write(f"{r['archive_sha256']}  {r['archive']}\n")
          complete={
              'schema':1,
              'donors_expected':8,
              'donors_archived':len(rows),
              'all_licence_signatures_verified':True,
              'aflplusplus_boundary':'AGPL-3.0 external development tool only',
              'exact_commit_archives':True,
          }
          (root/'HARVEST_COMPLETE.json').write_text(json.dumps(complete, indent=2)+'\n', encoding='utf-8')
          PY

          echo "WAVE2_BUNDLE=$root" >> "$GITHUB_ENV"

      - name: Upload complete Wave 2 source bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ECO-FOSS-DONORS-WAVE2-20260904
          path: ${{ env.WAVE2_BUNDLE }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          compression-level: 6
