name: Qualify hostile-input fuzz baseline

on:
  push:
    branches:
      - ops/hostile-input-fuzz-qualification-20260904
    paths:
      - .github/workflows/qualify-hostile-input-fuzz.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23.12'
          cache: false
      - name: Compile deterministic seed coverage
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/eco
      - name: Fuzz ZIP boundary
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/eco -run='^$' -fuzz='^FuzzZIPPreflightAndInspection$' -fuzztime=20s -parallel=2
      - name: Fuzz EML boundary
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/eco -run='^$' -fuzz='^FuzzEMLReader$' -fuzztime=20s -parallel=2
      - name: Fuzz XML boundary
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/eco -run='^$' -fuzz='^FuzzXMLReadableText$' -fuzztime=20s -parallel=2
      - name: Fuzz file-type sniffer
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/eco -run='^$' -fuzz='^FuzzFileTypeSniffer$' -fuzztime=20s -parallel=2
