name: Apply core native accessibility controls
on:
  push:
    paths:
      - .github/workflows/apply-accessibility-core.yml
      - scripts/ops/apply_accessibility_core.py
permissions:
  contents: write
jobs:
  apply-and-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: false
      - name: Apply controlled accessibility patch
        run: python3 scripts/ops/apply_accessibility_core.py
      - name: Format and qualify
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w cmd/eco/main_windows.go cmd/eco/winapi_windows.go cmd/eco/ui_regression_test.go
          go test ./...
          go vet ./...
          GOOS=windows GOARCH=amd64 go test -c ./cmd/eco -o /tmp/eco-cmd-a11y.test.exe
          GOOS=windows GOARCH=amd64 go build -o /tmp/ECO-a11y.exe ./cmd/eco
          python3 scripts/check_source_policy.py
          git diff --check
      - name: Commit qualified product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ECO Accessibility Integration Bot'
          git config user.email 'eco-accessibility-integration-bot@users.noreply.github.com'
          git add cmd/eco/main_windows.go cmd/eco/winapi_windows.go cmd/eco/ui_regression_test.go
          git diff --cached --quiet && { echo 'No product changes generated'; exit 1; }
          git commit -m 'Add native semantic controls for core journey'
          git push origin HEAD:integration/accessibility-core-native-controls-20260905
