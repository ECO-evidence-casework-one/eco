name: Repair PDFium integration generator anchor

on:
  push:
    branches:
      - integration/pdfium-page-renderer-20260904
    paths:
      - .github/workflows/fix-pdfium-generator.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: integration/pdfium-page-renderer-20260904
          fetch-depth: 0
      - name: Repair current-main citation indentation anchor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply_pdfium_page_renderer.py')
          s=p.read_text(encoding='utf-8')
          old_anchor="""citation_anchor = '''\\t\\ta.mu.Lock()\\n\\t\\tif c.Region != nil {\\n\\t\\t\\tregion := *c.Region\\n\\t\\t\\ta.pendingCitationRegion = &region\\n\\t\\t} else {\\n\\t\\t\\ta.pendingCitationRegion = nil\\n\\t\\t}\\n\\t\\ta.mu.Unlock()\\n'''"""
          new_anchor="""citation_anchor = '''\\t\\t\\ta.mu.Lock()\\n\\t\\t\\tif c.Region != nil {\\n\\t\\t\\t\\tregion := *c.Region\\n\\t\\t\\t\\ta.pendingCitationRegion = &region\\n\\t\\t\\t} else {\\n\\t\\t\\t\\ta.pendingCitationRegion = nil\\n\\t\\t\\t}\\n\\t\\t\\ta.mu.Unlock()\\n'''"""
          old_repl="""citation_repl = '''\\t\\ta.mu.Lock()\\n\\t\\tif c.Region != nil {\\n\\t\\t\\tregion := *c.Region\\n\\t\\t\\ta.pendingCitationRegion = &region\\n\\t\\t} else {\\n\\t\\t\\ta.pendingCitationRegion = nil\\n\\t\\t}\\n\\t\\ta.pendingCitationPage = c.Page\\n\\t\\ta.mu.Unlock()\\n'''"""
          new_repl="""citation_repl = '''\\t\\t\\ta.mu.Lock()\\n\\t\\t\\tif c.Region != nil {\\n\\t\\t\\t\\tregion := *c.Region\\n\\t\\t\\t\\ta.pendingCitationRegion = &region\\n\\t\\t\\t} else {\\n\\t\\t\\t\\ta.pendingCitationRegion = nil\\n\\t\\t\\t}\\n\\t\\t\\ta.pendingCitationPage = c.Page\\n\\t\\t\\ta.mu.Unlock()\\n'''"""
          if old_anchor not in s or old_repl not in s:
              raise SystemExit('expected citation generator strings not found')
          s=s.replace(old_anchor,new_anchor,1).replace(old_repl,new_repl,1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          git config user.name 'ECO GitHub integration bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/apply_pdfium_page_renderer.py
          git commit -m 'Fix PDFium citation patch anchor'
          git push origin HEAD:integration/pdfium-page-renderer-20260904
