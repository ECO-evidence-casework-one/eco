name: Qualify combined GitHub FOSS stack

on:
  push:
    branches:
      - staging/github-foss-stack-20260904
    paths:
      - .github/workflows/qualify-combined-foss-stack.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  combine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: staging/github-foss-stack-20260904
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23.12'
          cache: false
      - name: Merge all four green draft slices and qualify together
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ECO GitHub integration bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin \
            integration/tesseract-runtime-bundle-20260904 \
            integration/mbox-reader-20260904 \
            integration/hostile-input-fuzz-baseline-20260904

          git merge --no-ff --no-edit origin/integration/tesseract-runtime-bundle-20260904

          if ! git merge --no-ff --no-edit origin/integration/mbox-reader-20260904; then
            conflicts="$(git diff --name-only --diff-filter=U | sort)"
            expected=$'THIRD_PARTY_NOTICES.md\ninternal/eco/extract.go'
            if [ "$conflicts" != "$expected" ]; then
              echo "Unexpected combined-stack conflicts:" >&2
              printf '%s\n' "$conflicts" >&2
              exit 1
            fi

            git checkout --ours -- THIRD_PARTY_NOTICES.md internal/eco/extract.go

            python3 - <<'PY'
          from pathlib import Path

          p = Path('internal/eco/extract.go')
          s = p.read_text(encoding='utf-8')

          import_anchor = '\tpdf "github.com/ledongthuc/pdf"\n)'
          if import_anchor not in s:
              raise SystemExit('combined extract.go PDF import anchor not found')
          s = s.replace(import_anchor, '\tmbox "github.com/emersion/go-mbox"\n\tpdf "github.com/ledongthuc/pdf"\n)', 1)

          switch_anchor = '\tcase "eml":\n\t\ttext, err = extractEML(path)\n\tcase "zip":\n'
          if switch_anchor not in s:
              raise SystemExit('combined extract.go EML switch anchor not found')
          s = s.replace(switch_anchor, '\tcase "eml":\n\t\ttext, err = extractEML(path)\n\tcase "mbox":\n\t\ttext, err = extractMBOX(path)\n\tcase "zip":\n', 1)

          start = s.index('func extractEML(path string) (string, error) {')
          end = s.index('\nfunc inspectZIP(path string) (string, error) {', start)
          replacement = r'''const (
          	maxMBOXScanBytes    = int64(256 * 1024 * 1024)
          	maxMBOXMessageBytes = int64(8 * 1024 * 1024)
          	maxMBOXMessages     = 10000
          )

          func extractEML(path string) (string, error) {
          	f, err := os.Open(path)
          	if err != nil {
          		return "", err
          	}
          	defer f.Close()
          	return extractMailReader(io.LimitReader(f, maxExtractBytes))
          }

          func extractMailReader(r io.Reader) (string, error) {
          	msg, err := mail.ReadMessage(bufio.NewReader(r))
          	if err != nil {
          		return "", err
          	}
          	var b strings.Builder
          	for _, h := range []string{"From", "To", "Cc", "Date", "Subject", "Message-Id"} {
          		if v := msg.Header.Get(h); v != "" {
          			fmt.Fprintf(&b, "%s: %s\n", h, v)
          		}
          	}
          	b.WriteByte('\n')
          	ct := msg.Header.Get("Content-Type")
          	med, params, _ := mime.ParseMediaType(ct)
          	if strings.HasPrefix(med, "multipart/") {
          		mr := multipart.NewReader(msg.Body, params["boundary"])
          		for {
          			p, e := mr.NextPart()
          			if e == io.EOF {
          				break
          			}
          			if e != nil {
          				break
          			}
          			pct, _, _ := mime.ParseMediaType(p.Header.Get("Content-Type"))
          			if strings.HasPrefix(pct, "text/plain") || strings.HasPrefix(pct, "text/html") {
          				d, _ := io.ReadAll(io.LimitReader(p, maxExtractBytes))
          				s := string(d)
          				if strings.Contains(pct, "html") {
          					s = tagRE.ReplaceAllString(scriptRE.ReplaceAllString(s, " "), "\n")
          					s = html.UnescapeString(s)
          				}
          				b.WriteString(s)
          				b.WriteByte('\n')
          			}
          		}
          	} else {
          		d, _ := io.ReadAll(io.LimitReader(msg.Body, maxExtractBytes))
          		b.Write(d)
          	}
          	return b.String(), nil
          }

          func extractMBOX(path string) (string, error) {
          	f, err := os.Open(path)
          	if err != nil {
          		return "", err
          	}
          	defer f.Close()
          	info, err := f.Stat()
          	if err != nil {
          		return "", err
          	}
          	reader := mbox.NewReader(io.LimitReader(f, maxMBOXScanBytes))
          	var out strings.Builder
          	messages := 0
          	for messages < maxMBOXMessages {
          		messageReader, nextErr := reader.NextMessage()
          		if nextErr == io.EOF {
          			break
          		}
          		if nextErr != nil {
          			if messages == 0 {
          				return "", nextErr
          			}
          			fmt.Fprintf(&out, "[Mailbox parsing stopped after message %d: %s]\n", messages, boundMailboxDiagnostic(nextErr.Error()))
          			break
          		}
          		messages++
          		raw, readErr := io.ReadAll(io.LimitReader(messageReader, maxMBOXMessageBytes+1))
          		if readErr != nil {
          			fmt.Fprintf(&out, "Message %d\n[Message could not be read safely: %s]\n\n", messages, boundMailboxDiagnostic(readErr.Error()))
          			continue
          		}
          		if int64(len(raw)) > maxMBOXMessageBytes {
          			fmt.Fprintf(&out, "Message %d\n[Message exceeds ECO's 8 MiB automatic-reading limit and was not decoded.]\n\n", messages)
          			continue
          		}
          		text, parseErr := extractMailReader(bytes.NewReader(raw))
          		if parseErr != nil {
          			fmt.Fprintf(&out, "Message %d\n[Message headers/body could not be decoded safely: %s]\n\n", messages, boundMailboxDiagnostic(parseErr.Error()))
          			continue
          		}
          		fmt.Fprintf(&out, "Message %d\n%s\n\n", messages, strings.TrimSpace(text))
          		if out.Len() >= int(maxExtractBytes) {
          			out.WriteString("[Mailbox readable preview reached ECO's 24 MiB extracted-text bound.]\n")
          			break
          		}
          	}
          	if messages >= maxMBOXMessages {
          		fmt.Fprintf(&out, "[Mailbox preview reached the %d-message automatic-reading limit.]\n", maxMBOXMessages)
          	}
          	if info.Size() > maxMBOXScanBytes {
          		fmt.Fprintf(&out, "[Mailbox is larger than ECO's %s automatic scan window; later content was not read in this preview.]\n", HumanBytes(maxMBOXScanBytes))
          	}
          	if messages == 0 && strings.TrimSpace(out.String()) == "" {
          		return "", fmt.Errorf("mailbox contains no readable mbox messages")
          	}
          	return out.String(), nil
          }

          func boundMailboxDiagnostic(text string) string {
          	text = strings.TrimSpace(text)
          	runes := []rune(text)
          	if len(runes) > 384 {
          		return string(runes[:384]) + "…"
          	}
          	return text
          }
          '''
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')

          notices = Path('THIRD_PARTY_NOTICES.md')
          n = notices.read_text(encoding='utf-8')
          if 'emersion/go-mbox' not in n:
              n += '''\n\n## emersion/go-mbox — MBOX message framing\n\n- Upstream: `https://github.com/emersion/go-mbox`\n- Exact acquired commit: `1345da99f1254a23f517ffdc979f92359442473d`\n- Licence: MIT.\n- ECO use: bounded, read-only MBOX message framing before ECO's existing MIME/email extraction.\n'''
          notices.write_text(n, encoding='utf-8')
          PY

            git add -A
            git commit --no-edit
          fi

          git merge --no-ff --no-edit origin/integration/hostile-input-fuzz-baseline-20260904

          go mod tidy
          gofmt -w internal/eco/extract.go
          go test ./...
          go vet ./...
          python3 scripts/check_source_policy.py
          git diff --check

          cat > docs/foss/COMBINED_GITHUB_FOSS_STACK_QUALIFICATION.md <<'EOF'
          # Combined GitHub FOSS stack qualification

          Date: 2026-09-04

          This staging-only qualification combines the four independently green draft slices without merging them to `main`:

          - native PDF reader: `integration/native-pdf-reader-20260904` / PR #114;
          - verified Tesseract runtime bundle: `integration/tesseract-runtime-bundle-20260904` / PR #115;
          - bounded MBOX reader: `integration/mbox-reader-20260904` / PR #116;
          - hostile-input fuzz baseline: `integration/hostile-input-fuzz-baseline-20260904` / PR #117.

          The PDF and MBOX branches both modify `internal/eco/extract.go` and `THIRD_PARTY_NOTICES.md`; staging resolves those overlaps by retaining both PDF and MBOX imports, extraction cases, implementations and notices. No constituent draft PR or `main` is rewritten by this staging proof.
          EOF

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Record combined GitHub FOSS stack qualification state'
          fi
          git push origin HEAD:staging/github-foss-stack-20260904
