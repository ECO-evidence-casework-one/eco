name: M1.18 issue 65 exact-head qualification

on:
  pull_request:
    branches: [main]
    paths:
      - 'repairs/issue65/**'
      - '.github/workflows/m118-issue65-exact-head.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m118-issue65-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-hostile:
    name: Linux race and hostile qualification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23.x'
          check-latest: false
          cache: false

      - name: Reconstruct and apply frozen repair
        shell: bash
        run: |
          set -euo pipefail
          echo "EXACT_HEAD=$(git rev-parse HEAD)"
          expected=(
            2033ac2314d96fcd56a1cad1a0fba87e48d0cb8d039f59a226f331376e701ac7
            e40f5515361b370c809a99b90f1008bb8a74d39cdabf5ae5da40ec9a55293d4f
            dda168c4fedb305bb0ff882aff761ea8ac94c4d4df60c74871fed77c5d46b70e
            52e1e0aa954f4590ddf6f8665d8b8ca1582bb3ab32c2bb5cdb74b609b61de88a
            66d75dd6d825524cf044f986f82db13e2fe1e012d7ccad4029883d411a563ccf
          )
          : > /tmp/m118-repair.b64
          for i in 0 1 2 3 4; do
            src="repairs/issue65/repair.v2.part0${i}"
            clean="/tmp/repair-part-${i}"
            tr -d '\r\n\t ' < "$src" > "$clean"
            got="$(sha256sum "$clean" | cut -d' ' -f1)"
            echo "PART_${i}_SHA256=${got}"
            test "$got" = "${expected[$i]}"
            cat "$clean" >> /tmp/m118-repair.b64
          done
          test "$(wc -c < /tmp/m118-repair.b64 | tr -d ' ')" = "14696"
          base64 -d /tmp/m118-repair.b64 | gzip -d > /tmp/m118-issue65.patch
          patch_hash="$(sha256sum /tmp/m118-issue65.patch | cut -d' ' -f1)"
          echo "DECODED_PATCH_SHA256=${patch_hash}"
          test "${patch_hash}" = "68ad7817a0069e5c17c0ab770146800dc0213bfb9cdc77a7d85bd88c771359cd"
          git apply --check /tmp/m118-issue65.patch
          git apply /tmp/m118-issue65.patch
          test "$(sha256sum internal/runtime/turnorchestrator/orchestrator.go | cut -d' ' -f1)" = "acefa7452f7115facb3d097055eb00f4efe45c7bababc1ab888d07743bcbc7f4"
          test "$(sha256sum internal/runtime/turnorchestrator/types.go | cut -d' ' -f1)" = "8e11bb2945bea42be22a63a5f08c4c2956c204297d694fbf5826c8d8b0e5f9b3"

      - name: Ordinary tests
        run: go test ./internal/runtime/turnorchestrator -count=1

      - name: Race detector
        run: go test -race ./internal/runtime/turnorchestrator -count=1

      - name: Repeat hostile cases fifty times
        run: go test ./internal/runtime/turnorchestrator -run 'Issue65|NoOp|Stuck|Retained|Ignored|Subprocess|Cancellation' -count=50

      - name: Vet and formatting
        shell: bash
        run: |
          set -euo pipefail
          go vet ./internal/runtime/turnorchestrator
          test -z "$(gofmt -l internal/runtime/turnorchestrator)"

      - name: Confirm no executable artifact
        if: always()
        shell: bash
        run: |
          find . -type f \( -iname '*.exe' -o -iname '*.dll' -o -iname '*.gguf' \) -print
          echo 'No workflow artifact or release upload step exists.'

  windows-process:
    name: Windows process-termination qualification
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23.x'
          check-latest: false
          cache: false

      - name: Reconstruct and apply frozen repair
        shell: bash
        run: |
          set -euo pipefail
          echo "EXACT_HEAD=$(git rev-parse HEAD)"
          expected=(
            2033ac2314d96fcd56a1cad1a0fba87e48d0cb8d039f59a226f331376e701ac7
            e40f5515361b370c809a99b90f1008bb8a74d39cdabf5ae5da40ec9a55293d4f
            dda168c4fedb305bb0ff882aff761ea8ac94c4d4df60c74871fed77c5d46b70e
            52e1e0aa954f4590ddf6f8665d8b8ca1582bb3ab32c2bb5cdb74b609b61de88a
            66d75dd6d825524cf044f986f82db13e2fe1e012d7ccad4029883d411a563ccf
          )
          : > "$RUNNER_TEMP/m118-repair.b64"
          for i in 0 1 2 3 4; do
            src="repairs/issue65/repair.v2.part0${i}"
            clean="$RUNNER_TEMP/repair-part-${i}"
            tr -d '\r\n\t ' < "$src" > "$clean"
            got="$(sha256sum "$clean" | cut -d' ' -f1)"
            echo "PART_${i}_SHA256=${got}"
            test "$got" = "${expected[$i]}"
            cat "$clean" >> "$RUNNER_TEMP/m118-repair.b64"
          done
          test "$(wc -c < "$RUNNER_TEMP/m118-repair.b64" | tr -d ' ')" = "14696"
          base64 -d "$RUNNER_TEMP/m118-repair.b64" | gzip -d > "$RUNNER_TEMP/m118-issue65.patch"
          patch_hash="$(sha256sum "$RUNNER_TEMP/m118-issue65.patch" | cut -d' ' -f1)"
          echo "DECODED_PATCH_SHA256=${patch_hash}"
          test "${patch_hash}" = "68ad7817a0069e5c17c0ab770146800dc0213bfb9cdc77a7d85bd88c771359cd"
          git apply --check "$RUNNER_TEMP/m118-issue65.patch"
          git apply "$RUNNER_TEMP/m118-issue65.patch"
          test "$(sha256sum internal/runtime/turnorchestrator/orchestrator.go | cut -d' ' -f1)" = "acefa7452f7115facb3d097055eb00f4efe45c7bababc1ab888d07743bcbc7f4"

      - name: Run complete package on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test ./internal/runtime/turnorchestrator -count=1
          if ($LASTEXITCODE -ne 0) { throw 'Windows ordinary tests failed.' }

      - name: Repeat Windows hostile process cases
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test ./internal/runtime/turnorchestrator -run 'Issue65|NoOp|Stuck|Retained|Ignored|Subprocess|Cancellation' -count=20
          if ($LASTEXITCODE -ne 0) { throw 'Windows hostile tests failed.' }

      - name: Vet on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go vet ./internal/runtime/turnorchestrator
          if ($LASTEXITCODE -ne 0) { throw 'Windows vet failed.' }

      - name: Confirm no executable artifact
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -File -Include *.exe,*.dll,*.gguf | Select-Object FullName,Length
          Write-Host 'No workflow artifact or release upload step exists.'
