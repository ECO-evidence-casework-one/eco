name: Qualify strict open and explicit create
on:
  push:
    branches: [integration/restore-forced-stop-restart-20260905]
    paths: [.github/workflows/qualify-explicit-open-create.yml]
permissions:
  contents: write
jobs:
  qualify:
    if: github.ref == 'refs/heads/integration/restore-forced-stop-restart-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: false
      - name: Prove ordinary opens still create state before the review repair
        shell: bash
        run: |
          set -euo pipefail
          cat > internal/eco/strict_open_contract_test.go <<'GO'
          package eco
          import("os";"path/filepath";"reflect";"testing")
          func TestStrictOpenNeverCreates(t *testing.T) {
            for _,name:=range []string{"missing","empty"} {
              t.Run(name,func(t *testing.T){
                parent:=t.TempDir();root:=filepath.Join(parent,"selected")
                if name=="empty" {if err:=os.Mkdir(root,0700);err!=nil{t.Fatal(err)}}
                before:=workspaceFormatTree(t,parent)
                v,err:=OpenVault(root)
                if v!=nil{_=v.Close()}
                if err==nil{t.Error("ordinary open initialized missing committed state")}
                if !reflect.DeepEqual(before,workspaceFormatTree(t,parent)){t.Error("ordinary open mutated a missing/empty selection")}
              })
            }
          }
          GO
          set +e
          go test -count=1 -json -run '^TestStrictOpenNeverCreates$' ./internal/eco > "$RUNNER_TEMP/open-before.jsonl" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/open-before.jsonl"
          test "$result" -eq 1
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=[]
          for s in Path(os.environ['RUNNER_TEMP'],'open-before.jsonl').read_text().splitlines():
              try:rows.append(json.loads(s))
              except json.JSONDecodeError:pass
          failed={r.get('Test') for r in rows if r.get('Action')=='fail'}
          assert {'TestStrictOpenNeverCreates/missing','TestStrictOpenNeverCreates/empty'}<=failed
          PY
      - name: Separate ordinary open from explicit creation and migrate only fixture setup calls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          def once(s,old,new):
              assert s.count(old)==1,repr(old)
              return s.replace(old,new,1)
          p=Path('internal/eco/vault.go');s=p.read_text()
          a=s.index('func OpenVault(root string)');b=s.index('// allowFresh is reserved',a)
          legacy=s[a:b].replace('func OpenVault(', 'func openTestVault(',1).replace('openOwnedVault(owner, false)','openOwnedVault(owner, true)',1)
          Path('internal/eco/vault_fixture_test.go').write_text('package eco\n\n// Test-only fixture convenience retaining prior create-or-open setup behaviour.\n// Application code cannot invoke this helper. Strict-open contract tests do not use it.\n'+legacy)
          ordinary='''func OpenVault(root string) (*Vault, error) {
            if err := CheckWorkspaceRecoveryState(root); err != nil { return nil, err }
            if err := ValidateExistingWorkspaceRoot(root); err != nil { return nil, fmt.Errorf("open existing workspace: %w", err) }
            if err := preflightWorkspaceFormat(root); err != nil { return nil, err }
            owner, err := acquireWorkspaceRootOwner(root)
            if err != nil { return nil, err }
            return openOwnedVault(owner, false)
          }

          '''
          s=s[:a]+ordinary+s[b:]
          old='\tif !allowFresh {\n\t\tif err := CheckWorkspaceRecoveryState(root); err != nil {\n\t\t\treturn nil, err\n\t\t}\n\t}'
          new='\tif !allowFresh {\n\t\tif err := CheckWorkspaceRecoveryState(root); err != nil {\n\t\t\treturn nil, err\n\t\t}\n\t\tif err := ValidateExistingWorkspaceRoot(root); err != nil {\n\t\t\treturn nil, fmt.Errorf("open existing workspace under ownership: %w", err)\n\t\t}\n\t}'
          s=once(s,old,new);p.write_text(s)
          Path('internal/eco/explicit_clean_start.go').write_text(textwrap.dedent('''\
          package eco
          import("errors";"fmt";"path/filepath")

          // CreateVault is explicit new-state creation, never an existing open.
          // The final directory must be newly created by this call and identified
          // again under exclusive ownership. Existing routes are never adopted.
          func CreateVault(root string)(*Vault,error) {
            if root=="" { return nil,errors.New("empty workspace root") }
            absolute,err:=filepath.Abs(root);if err!=nil{return nil,err}
            creation,err:=acquireWorkspaceCreationOwner(absolute);if err!=nil{return nil,err}
            defer creation.Close()
            created,err:=creation.createMissingHierarchy()
            if err!=nil {cleanupCreatedWorkspaceDirectories(created);return nil,err}
            var identity workspaceObjectIdentity
            for _,entry:=range created {if entry.path==absolute{identity=entry.identity}}
            if !identity.valid(){cleanupCreatedWorkspaceDirectories(created);return nil,errors.New("new workspace directory was not created by this operation")}
            owner,err:=acquireWorkspaceRootOwner(absolute)
            if err!=nil{cleanupCreatedWorkspaceDirectories(created);return nil,err}
            if !identity.equal(owner.identity){_=owner.Close();return nil,errors.New("new workspace directory identity changed")}
            if err:=creation.revalidate();err!=nil{_=owner.Close();return nil,err}
            return openOwnedVault(owner,true)
          }

          // StartCleanDevelopmentWorkspace preserves old state before explicit
          // creation. Incomplete operations leave preserved copies for recovery.
          func StartCleanDevelopmentWorkspace(root string)(string,error){return startCleanDevelopmentWorkspace(root,nil)}
          func startCleanDevelopmentWorkspace(root string,boundary func(string))(string,error){
            if root==""{return "",errors.New("empty workspace root")}
            absolute,err:=filepath.Abs(root);if err!=nil{return "",err}
            archive,err:=ArchiveDevelopmentWorkspaceForCleanStart(absolute);if err!=nil{return archive,err}
            fail:=func(cause error)(string,error){return archive,fmt.Errorf("explicit clean start did not finish; retain all workspace copies (archived route %q): %w",archive,cause)}
            if boundary!=nil{boundary("reset_archived")}
            fresh,err:=CreateVault(absolute);if err!=nil{return fail(err)}
            defer fresh.Close()
            if boundary!=nil{boundary("reset_created")}
            if err:=fresh.Close();err!=nil{return fail(err)}
            return archive,nil
          }
          '''))
          p=Path('internal/eco/backup.go');s=once(p.read_text(),'stage, err := OpenVault(stageRoot)','stage, err := CreateVault(stageRoot)');p.write_text(s)
          p=Path('cmd/eco/main_windows.go');s=p.read_text()
          a=s.index('func chooseDevelopmentWorkspace(');b=s.index('\tif candidateInfo == nil',a)
          segment=s[a:b];assert segment.count('return candidate, true')==2
          segment=segment.replace('return candidate, true','return createNewCandidate(candidate)')
          s=s[:a]+segment+s[b:]
          anchor='func startCleanCandidate(candidate string) (string, bool) {'
          helper='''func createNewCandidate(candidate string) (string, bool) {
            v, err := eco.CreateVault(candidate)
            if err != nil { messageBox(0,"ECO could not create a new workspace",err.Error(),MB_OK|MB_ICONERROR);return "",false }
            if err := v.Close();err != nil {messageBox(0,"ECO workspace creation did not finish",err.Error(),MB_OK|MB_ICONERROR);return "",false}
            messageBox(0,"New ECO candidate workspace","A new empty workspace was created explicitly at:\\r\\n\\r\\n"+candidate,MB_OK|MB_ICONINFORMATION)
            return candidate,true
          }

          '''
          s=once(s,anchor,helper+anchor);p.write_text(s)
          p=Path('cmd/eco/main_other.go');s=p.read_text()
          old='\tv, err := eco.OpenVault(root)'
          new='\tif err := eco.CheckWorkspaceRecoveryState(root); err != nil { panic(err) }\n\tvar v *eco.Vault\n\tvar err error\n\tif _, checkErr := os.Lstat(root); os.IsNotExist(checkErr) {\n\t\tv, err = eco.CreateVault(root)\n\t} else {\n\t\tv, err = eco.OpenVault(root)\n\t}'
          s=once(s,old,new);p.write_text(s)
          p=Path('cmd/eco/ui_regression_test.go');s=once(p.read_text(),'"StartCleanDevelopmentWorkspace", "CheckWorkspaceRecoveryState"','"StartCleanDevelopmentWorkspace", "CheckWorkspaceRecoveryState", "eco.CreateVault", "eco.OpenVault", "createNewCandidate"');p.write_text(s)
          p=Path('internal/eco/restore_restart_test.go');s=p.read_text()
          # These setup/positive controls now use explicit creation. Guard and
          # actual restart tests continue to call strict OpenVault directly.
          s=once(s,'\t\t\tv, err := OpenVault(root)','\t\t\tvar v *Vault\n\t\t\tvar err error\n\t\t\tif name == "healthy_existing" { v, err = OpenVault(root) } else { v, err = CreateVault(root) }')
          s=once(s,'\t\t\t\tv, err := OpenVault(root)','\t\t\t\tv, err := CreateVault(root)');p.write_text(s)
          # Print every production caller for review. Do not silently rewrite
          # any additional product initialization route.
          for p in Path('.').rglob('*.go'):
              if not p.name.endswith('_test.go'):
                  for i,line in enumerate(p.read_text().splitlines(),1):
                      if 'OpenVault(' in line or 'CreateVault(' in line: print(f'{p}:{i}: {line.strip()}')
          PY
          cat > "$RUNNER_TEMP/migrate-fixture-calls.go" <<'GO'
          package main
          import("go/ast";"go/parser";"go/token";"go/format";"bytes";"os";"path/filepath";"fmt")
          func main(){
            skip:=map[string]bool{"strict_open_contract_test.go":true,"vault_fixture_test.go":true,"restore_forced_stop_test.go":true,"restore_restart_test.go":true,"explicit_clean_start_test.go":true}
            paths,err:=filepath.Glob("internal/eco/*_test.go");if err!=nil{panic(err)}
            for _,p:=range paths{
              if skip[filepath.Base(p)]{continue}
              fs:=token.NewFileSet();f,err:=parser.ParseFile(fs,p,nil,parser.ParseComments);if err!=nil{panic(err)}
              n:=0
              ast.Inspect(f,func(node ast.Node)bool{if call,ok:=node.(*ast.CallExpr);ok{if id,ok:=call.Fun.(*ast.Ident);ok&&id.Name=="OpenVault"{id.Name="openTestVault";n++}};return true})
              if n==0{continue};var b bytes.Buffer;if err:=format.Node(&b,fs,f);err!=nil{panic(err)}
              if err:=os.WriteFile(p,b.Bytes(),0600);err!=nil{panic(err)};fmt.Printf("FIXTURE-ONLY %s: %d call targets\n",p,n)
            }
          }
          GO
          go run "$RUNNER_TEMP/migrate-fixture-calls.go"
          cat > internal/eco/explicit_create_contract_test.go <<'GO'
          package eco
          import("os";"path/filepath";"reflect";"testing")
          func TestExplicitCreateThenStrictOpen(t *testing.T){
            root:=filepath.Join(t.TempDir(),"new")
            v,err:=CreateVault(root);if err!=nil{t.Fatal(err)}
            if _,err:=v.CreateMatter("explicit creation retained");err!=nil{_=v.Close();t.Fatal(err)}
            if err:=v.Close();err!=nil{t.Fatal(err)}
            before:=workspaceFormatTree(t,root)
            reopened,err:=OpenVault(root);if err!=nil{t.Fatal(err)};defer reopened.Close()
            if len(reopened.Snapshot().Matters)!=1{t.Fatal("strict reopen lost explicit state")}
            if !reflect.DeepEqual(before,workspaceFormatTree(t,root)){t.Fatal("strict reopen changed committed state")}
          }
          func TestExplicitCreateRefusesExistingRoutes(t *testing.T){
            for _,name:=range []string{"empty","unrelated","workspace"}{t.Run(name,func(t *testing.T){
              parent:=t.TempDir();root:=filepath.Join(parent,"existing")
              if name=="workspace"{v,err:=CreateVault(root);if err!=nil{t.Fatal(err)};if err:=v.Close();err!=nil{t.Fatal(err)}}else{if err:=os.Mkdir(root,0700);err!=nil{t.Fatal(err)}}
              if name=="unrelated"{if err:=os.WriteFile(filepath.Join(root,"keep.txt"),[]byte("synthetic unrelated file"),0600);err!=nil{t.Fatal(err)}}
              before:=workspaceFormatTree(t,parent)
              v,err:=CreateVault(root);if v!=nil{_=v.Close()};if err==nil{t.Error("explicit create adopted existing route")}
              if !reflect.DeepEqual(before,workspaceFormatTree(t,parent)){t.Error("refused creation changed existing route")}
            })}
          }
          GO
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          paths=list(Path('internal/eco').glob('*_test.go'))+[Path(p) for p in ['internal/eco/vault.go','internal/eco/explicit_clean_start.go','internal/eco/backup.go','cmd/eco/main_windows.go','cmd/eco/main_other.go','cmd/eco/ui_regression_test.go']]
          subprocess.run(['gofmt','-w',*[str(p) for p in paths]],check=True)
          PY
          git diff --check
      - name: Qualify contract repair, actual restart paths and full source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_source_policy.py
          go test -count=1 -json -run '^(TestStrictOpenNeverCreates|TestExplicitCreateThenStrictOpen|TestExplicitCreateRefusesExistingRoutes|TestRestoreForcedStopRestart|TestRestoreRestartGuard|TestRestoreRestartPositiveControls|TestExplicitCleanStartWithRestoreHistory|TestExplicitCleanStartRefusesLiveOwner|TestResetForcedStopRestart)$' ./internal/eco | tee "$RUNNER_TEMP/open-after.jsonl"
          go test -count=1 ./...
          go vet ./...
          GOOS=windows GOARCH=amd64 go test -c ./internal/eco -o "$RUNNER_TEMP/open-create.test.exe"
          GOOS=windows GOARCH=amd64 go build -o "$RUNNER_TEMP/open-create.exe" ./cmd/eco
          git diff --check
      - name: Record exact passing scope and commit source changes only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=[json.loads(s) for s in Path(os.environ['RUNNER_TEMP'],'open-after.jsonl').read_text().splitlines()]
          assert not any(r.get('Action') in {'fail','skip'} for r in rows)
          singles={'TestExplicitCreateThenStrictOpen','TestExplicitCleanStartWithRestoreHistory','TestExplicitCleanStartRefusesLiveOwner'}
          leaves=sorted(r['Test'] for r in rows if r.get('Action')=='pass' and ('/' in r.get('Test','') or r.get('Test') in singles))
          assert len(leaves)==23,leaves
          receipt={'run_id':os.environ['GITHUB_RUN_ID'],'input_head':os.environ['GITHUB_SHA'],'review_comment':3941175805,'before':'Both missing and empty ordinary-open cases failed before strict OpenVault','after_passing_cases':leaves,'after_skips':0,'linux_full_tests':'passed','go_vet':'passed','source_policy':'passed','windows_cross_build':'passed','native_windows':'pending exact final PR CI','fixture_migration':'AST call-target changes from OpenVault to openTestVault in pre-existing internal test setup; compatibility helper exists only in _test.go. New strict-open and actual restart cases exercise production OpenVault.','limits':['Seven real process-stop phases are not arbitrary power-loss coverage.','Final W7 failure-reporting/acceptance mapping and W8 actual Acer acceptance remain.']}
          Path('docs/control/EXPLICIT_OPEN_CREATE_QUALIFICATION_20260905.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
          branch='integration/restore-forced-stop-restart-20260905'
          git fetch origin "$branch"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/eco/vault.go internal/eco/explicit_clean_start.go internal/eco/backup.go cmd/eco/main_windows.go cmd/eco/main_other.go cmd/eco/ui_regression_test.go internal/eco/*_test.go docs/control/EXPLICIT_OPEN_CREATE_QUALIFICATION_20260905.json
          git commit -m 'Require existing state for OpenVault and reserve creation for explicit callers'
          git push origin "HEAD:refs/heads/$branch"
