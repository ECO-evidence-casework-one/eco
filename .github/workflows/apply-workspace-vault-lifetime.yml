name: Apply workspace Vault lifetime integration

on:
  push:
    paths:
      - '.github/workflows/apply-workspace-vault-lifetime.yml'
      - 'scripts/apply_workspace_vault_lifetime.py'

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23.12'
          cache: false
      - name: Apply controlled lifecycle patch
        run: python3 scripts/apply_workspace_vault_lifetime.py
      - name: Format and qualify current-main integration
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w internal/eco/vault.go internal/eco/backup.go internal/eco/vault_lifetime_test.go
          python3 scripts/check_source_policy.py
          go test ./...
          go vet ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go test -c ./internal/eco -o "$RUNNER_TEMP/eco-workspace-lifetime-windows-tests.exe"
          git diff --check
      - name: Commit qualified product changes only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ECO GitHub integration bot'
          git config user.email 'actions@users.noreply.github.com'
          git add internal/eco/vault.go internal/eco/backup.go internal/eco/vault_lifetime_test.go
          if git diff --cached --quiet; then
            echo 'No product changes to commit'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'Bind Vault lifetime to workspace ownership'
          git push origin HEAD:integration/workspace-vault-lifetime-current-main-20260905
